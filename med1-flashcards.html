<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Med 1 — Flashcards</title>
<script>try{if(localStorage.getItem('fysio-theme')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap">
<meta name="theme-color" content="#0c070a">
<style>/* Ny stil för Med 1-quizet och flashcards (samma redaktionella stil som övningstentan och Fysioterapi 3).
   Ersätter sidornas gamla <style>. Klassnamnen är de gamla, så sidornas logik och sparade resultat är orörda. */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark;
 --page:#0c070a;--panel:#2a1c25;--panel-hover:#3a2632;--ink:#efe7eb;--mute:#b3a5ad;--rule:#4b3942;--hair:#2b2027;
 --strong:#f1d3e3;--accent:#FF876F;--hl:#FF876F;--band:#870052;--btn:#870052;--btn-hover:#a3176a;--ok:#74cfa0;--bad:#f0908b;--mid:#e5c07b;
 --font:'DM Sans',Arial,sans-serif;
 /* gamla namn, pekar på de nya */
 --bg:var(--page);--surface:var(--page);--text:var(--ink);--text-secondary:var(--mute);--border:var(--rule);
 --plommon-deep:var(--strong);--plommon-mid:var(--accent);--plommon-light:var(--panel);--plommon-ghost:var(--panel);
 --knew:var(--ok);--unsure:var(--mid);--missed:var(--bad);--warn:var(--mid)}
:root[data-theme="light"]{color-scheme:light;
 --page:#fff;--panel:#F1F1F1;--panel-hover:#E4E4E4;--ink:#1c1c1c;--mute:#5f5f5f;--rule:#d4d4d4;--hair:#e8e8e8;
 --strong:#4F0433;--accent:#C4452D;--hl:#FF876F;--band:#4F0433;--btn:#4F0433;--btn-hover:#870052;--ok:#2E6B4F;--bad:#A23A37;--mid:#8a6a12}
html{-webkit-text-size-adjust:100%;--gut:clamp(1rem,4vw,3.5rem)}
body{font-family:var(--font);font-size:16px;line-height:1.55;color:var(--ink);background:var(--page);position:relative}
body::before{content:"";display:block;height:6px;background:var(--band)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
[hidden]{display:none!important}
.app{max-width:880px;margin:0 auto;padding:0 var(--gut) 7rem}

/* Sidhuvud */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:1rem 0 0}
.home{font-size:14px;font-weight:500;color:var(--accent);text-decoration:none}
.home:hover{color:var(--strong);text-decoration:underline}
.theme-btn{font-size:14px;font-weight:500;color:var(--accent);padding:.1rem 0;border-bottom:1px solid currentColor}
.theme-btn:hover{color:var(--strong)}
.header{padding:2rem 0 1.3rem;border-bottom:1px solid var(--rule);margin-bottom:1.3rem}
.header h1{font-size:clamp(34px,4.5vw,52px);line-height:1.05;font-weight:800;letter-spacing:-.02em;color:var(--strong)}
.header p,.header .sub{font-size:17px;color:var(--mute);margin-top:.6rem;font-style:normal}
.header .sub{font-size:15px;margin-top:.2rem}

/* Status, ämnen, lägen */
.stats{display:flex;flex-wrap:wrap;gap:.2rem 1.2rem;font-size:14px;color:var(--mute);margin-bottom:1rem;font-variant-numeric:tabular-nums}
.stats strong{color:var(--ink)}
.s-ok strong,.s-knew strong{color:var(--ok)}.s-bad strong,.s-missed strong{color:var(--bad)}.s-unsure strong{color:var(--mid)}
.pills{display:flex;flex-wrap:wrap;gap:.2rem 1.1rem;margin:0 0 .6rem}
.pill,.pills.topics .pill{font-size:15px;color:var(--mute);padding:.2rem 0;border:0;border-bottom:2px solid transparent;background:none;border-radius:0;white-space:nowrap}
.pill:hover{color:var(--strong)}
.pill.active,.pills.topics .pill.active{color:var(--strong);font-weight:700;border-bottom-color:var(--hl);background:none}
.pills.topics{padding-top:.4rem;border-top:1px solid var(--hair)}
.pills.topics .pill{font-size:14px}
.mode-row{display:flex;flex-wrap:wrap;gap:.3rem 1.1rem;align-items:center;margin:.4rem 0 1.4rem;padding-bottom:.6rem;border-bottom:1px solid var(--rule)}
.mode-label{font-size:14px;font-weight:700;color:var(--strong)}
.mode-btn,.tool-btn,.browse-btn{font-size:15px;color:var(--mute);padding:.2rem 0;border:0;border-bottom:2px solid transparent;background:none;border-radius:0}
.mode-btn:hover,.tool-btn:hover,.browse-btn:hover{color:var(--strong)}
.mode-btn.active{color:var(--strong);font-weight:700;border-bottom-color:var(--hl);background:none}
.tool-btn,.browse-btn{color:var(--accent)}
.spacer,.browse-btn{margin-left:auto}

/* Frågan / kortet: inga lådor, bara linjer */
.card{background:none;border-radius:0;box-shadow:none;padding:1.1rem 0 1.4rem;margin:0 0 1rem;border-top:2px solid var(--strong);border-bottom:1px solid var(--rule)}
.card-section{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;font-size:14px;font-weight:500;color:var(--mute);letter-spacing:0;text-transform:none;margin-bottom:.4rem}
.card-qnum{font-size:14px;font-weight:700;color:var(--accent);letter-spacing:0;white-space:nowrap}
.card-q,.card-prompt{font-size:22px;font-weight:700;line-height:1.3;color:var(--strong);margin:.3rem 0 1rem;max-width:32em;text-wrap:pretty}
.card-prompt .hint{font-size:15px;color:var(--mute);font-weight:400}
.opts{display:flex;flex-direction:column;gap:0;max-width:44em}
.opt{display:flex;gap:.8rem;align-items:flex-start;text-align:left;font-size:16px;line-height:1.45;padding:.65rem .8rem;border:0;border-top:1px solid var(--hair);border-left:3px solid transparent;border-radius:0;background:none;color:var(--ink)}
.opt:last-child{border-bottom:1px solid var(--hair)}
.opt:hover:not(:disabled){background:var(--panel-hover);border-color:var(--hair);border-left-color:var(--strong)}
.opt .key{font-weight:700;color:var(--accent);min-width:1em}
.opt:disabled{cursor:default}
.opt.correct{border-left-color:var(--ok);background:none;color:var(--ok);font-weight:700}.opt.correct .key{color:var(--ok)}
.opt.wrong{border-left-color:var(--bad);background:none;color:var(--bad);text-decoration:line-through}.opt.wrong .key{color:var(--bad)}
.opt.dim{opacity:.5}
.expl,.answer-area{margin-top:1rem;padding:.9rem 0 0;border:0;border-top:1px solid var(--rule);border-radius:0;background:none;font-size:16px;line-height:1.6;max-width:40em}
.expl strong,.answer-area strong{color:var(--strong)}
.verdict{font-size:17px;font-weight:700;margin-bottom:.4rem}.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.reveal-btn{display:inline-block;width:auto;margin-top:1rem;font-size:15px;font-weight:700;background:var(--btn);color:#fff;border:1.5px solid var(--btn);border-radius:0;padding:.45rem 1rem}
.reveal-btn:hover{background:var(--btn-hover);border-color:var(--btn-hover)}
.rate-row{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1rem}
.rate-btn{flex:0 0 auto;font-size:15px;font-weight:700;padding:.45rem 1rem;border-radius:0;border:1.5px solid;background:transparent}
.rate-btn:hover{transform:none}
.rate-btn.knew{color:var(--ok);border-color:var(--ok)}.rate-btn.knew:hover{background:var(--ok);color:var(--page)}
.rate-btn.unsure{color:var(--mid);border-color:var(--mid)}.rate-btn.unsure:hover{background:var(--mid);color:var(--page)}
.rate-btn.missed{color:var(--bad);border-color:var(--bad)}.rate-btn.missed:hover{background:var(--bad);color:var(--page)}
.nav-row{display:flex;gap:.6rem;margin-top:1.2rem;padding-top:.8rem;border-top:1px solid var(--hair)}
.nav-btn,.nav-btn.secondary{font-size:15px;font-weight:700;padding:.45rem 1rem;border-radius:0;background:transparent;color:var(--strong);border:1.5px solid var(--strong)}
.nav-btn:hover,.nav-btn.secondary:hover{background:var(--panel-hover);color:var(--strong);border-color:var(--strong)}
.nav-btn.primary{background:var(--btn);color:#fff;border-color:var(--btn)}
.nav-btn.primary:hover{background:var(--btn-hover);border-color:var(--btn-hover);color:#fff}
.hint{font-size:13px;color:var(--mute);margin-top:.6rem;text-align:right}

/* Resultat */
.finish{text-align:left;padding:1.4rem 0}
.finish h2{font-size:28px;font-weight:800;letter-spacing:-.01em;color:var(--strong);margin-bottom:.4rem}
.finish h2::after{content:"";display:block;width:48px;height:3px;background:var(--hl);margin-top:.55rem}
.big{font-size:56px;font-weight:700;letter-spacing:-.02em;color:var(--strong);font-variant-numeric:tabular-nums;line-height:1.1;margin-top:.6rem}
.finish .sub,.finish p{font-size:16px;color:var(--mute);margin-bottom:1rem}
.breakdown{text-align:left;margin:1rem 0 1.4rem;border-top:2px solid var(--strong)}
.breakdown h3{font-size:14px;font-weight:700;color:var(--strong);padding:.5rem 0;border-bottom:1px solid var(--strong)}
.b-row,.breakdown-row{display:flex;align-items:center;gap:1rem;padding:.45rem 0;border-bottom:1px solid var(--hair);font-size:15px}
.b-name,.breakdown-name{flex:1}
.b-sub{font-size:14px;color:var(--mute);padding-left:1rem}
.b-num{color:var(--mute);min-width:4rem;text-align:right;font-variant-numeric:tabular-nums}
.b-pct{font-weight:700;min-width:3rem;text-align:right;font-variant-numeric:tabular-nums}
.pct-ok,.c-knew{color:var(--ok)}.pct-warn,.c-unsure{color:var(--mid)}.pct-bad,.c-missed{color:var(--bad)}
.breakdown-counts{display:flex;gap:.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.note{font-size:14px;color:var(--mute);margin-top:.6rem}
.restart-btn{font-size:15px;font-weight:700;padding:.45rem 1rem;border-radius:0;border:1.5px solid var(--strong);background:transparent;color:var(--strong);margin:0 .5rem .5rem 0}
.restart-btn:hover{background:var(--panel-hover)}
.restart-btn.primary{background:var(--btn);border-color:var(--btn);color:#fff}
.restart-btn.primary:hover{background:var(--btn-hover);border-color:var(--btn-hover)}
.restart-btn:disabled{opacity:.35;cursor:default}
.save-row{display:flex;margin-top:.6rem}
.save-btn{font-size:14px;font-weight:500;color:var(--accent);border:0;border-bottom:1px solid currentColor;border-radius:0;background:none;padding:.1rem 0}

/* Förloppsrad */
.progress-wrap{position:fixed;bottom:0;left:0;right:0;background:var(--page);border-top:1px solid var(--rule);padding:.6rem var(--gut) .8rem;z-index:10}
.progress-inner{max-width:880px;margin:0 auto}
.progress-label{font-size:13px;color:var(--mute);margin-bottom:.35rem;font-variant-numeric:tabular-nums}
.progress-track{height:4px;border-radius:0;background:var(--hair);overflow:hidden}
.progress-fill{height:100%;border-radius:0;background:var(--hl);transition:width .3s ease}

/* Bläddra */
.index-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.index-panel{background:var(--page);border-radius:0;border-top:4px solid var(--strong);width:100%;max-width:880px;max-height:78vh;display:flex;flex-direction:column;box-shadow:none}
.index-header{display:flex;justify-content:space-between;align-items:center;padding:1rem var(--gut) .6rem;border-bottom:1px solid var(--rule)}
.index-header h3{font-size:19px;font-weight:700;color:var(--strong)}
.index-close{font-size:26px;line-height:1;color:var(--mute)}.index-close:hover{color:var(--strong)}
.index-search{margin:.8rem var(--gut) 0;width:calc(100% - 2 * var(--gut));padding:.45rem .6rem;border-radius:0;border:1px solid var(--rule);background:var(--panel);color:var(--ink);font:inherit;font-size:15px}
.index-search::placeholder{color:var(--mute)}
.index-body{overflow-y:auto;padding:.4rem var(--gut) 1.4rem;flex:1}
.idx-group,.index-group-label{font-size:14px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--strong);padding:.9rem 0 .3rem;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--page)}
.idx-topic{font-size:14px;font-weight:700;color:var(--mute);padding:.6rem 0 .1rem}
.idx-item,.index-item{display:flex;gap:.8rem;align-items:baseline;padding:.4rem .3rem;border-radius:0;border-bottom:1px solid var(--hair);cursor:pointer;font-size:15px;line-height:1.4}
.idx-item:hover,.index-item:hover{background:var(--panel-hover)}
.idx-num,.index-item-num{font-weight:700;color:var(--accent);min-width:3.4rem;font-variant-numeric:tabular-nums}
.idx-q,.index-item-q{flex:1;color:var(--ink)}
.badge,.index-item-badge{font-size:13px;font-weight:700;padding:0;border-radius:0;background:none!important}
.badge.ok,.index-item-badge.knew{color:var(--ok)}.badge.bad,.index-item-badge.missed{color:var(--bad)}.index-item-badge.unsure{color:var(--mid)}

@media (max-width:560px){
 body{font-size:15.5px}
 .card-q,.card-prompt{font-size:19px}
 .opt{font-size:15px;padding:.6rem .5rem}
 .hint{display:none}
 .spacer,.browse-btn{margin-left:0}
}
</style>
</head>
<body>
<div class="app">
  <div class="topbar"><a class="home" href="index.html">&#8592; Start</a><button class="theme-btn" id="theme-btn" onclick="cycleTheme()"></button></div>
  <div class="header">
    <h1>Repetitionskort</h1>
    <p>Tänk efter, vänd kortet, betygsätt dig själv</p>
    <div class="sub">Kirurgi · Ortopedi · Allmän medicin · Reumatologi · Gynekologi — 102 kort</div>
  </div>
  <div class="stats">
    <span>Kort <strong id="stat-num">1</strong> / <strong id="stat-total">0</strong></span>
    <span class="s-knew">Kunde: <strong id="s-knew">0</strong></span>
    <span class="s-unsure">Osäker: <strong id="s-unsure">0</strong></span>
    <span class="s-missed">Missade: <strong id="s-missed">0</strong></span>
  </div>
  <div class="pills" id="pills"></div>
  <div class="mode-row">
    <span class="mode-label">Ordning:</span>
    <button class="mode-btn active" id="mode-shuffle" onclick="setMode('shuffle')">Slumpad</button>
    <button class="mode-btn" id="mode-seq" onclick="setMode('seq')">I ordning</button>
    <button class="browse-btn" onclick="openIndex()">Bläddra kort</button>
  </div>
  <div id="card-area">
    <div class="card" id="card">
      <div class="card-section" id="card-section"></div>
      <div class="card-prompt" id="card-prompt"></div>
      <button class="reveal-btn" id="reveal-btn" onclick="reveal()">Visa svar</button>
      <div class="answer-area" id="answer-area" hidden></div>
      <div class="rate-row" id="rate-row" hidden>
        <button class="rate-btn knew" onclick="rate('knew')">Kunde</button>
        <button class="rate-btn unsure" onclick="rate('unsure')">Osäker</button>
        <button class="rate-btn missed" onclick="rate('missed')">Missade</button>
      </div>
      <div class="nav-row" id="nav-row">
        <button class="nav-btn secondary" id="prev-btn" onclick="go(-1)">&#8592; Föregående</button>
        <button class="nav-btn secondary" id="next-btn" onclick="go(1)" style="margin-left:auto">Hoppa över &#8594;</button>
      </div>
    </div>
  </div>
  <div id="finish-area" hidden>
    <div class="card finish">
      <h2>Genomgång klar!</h2>
      <p id="final-msg"></p>
      <div class="breakdown" id="breakdown"></div>
      <button class="restart-btn primary" onclick="restart('all')">Kör alla igen</button>
      <button class="restart-btn" onclick="restart('unsure')">Osäkra + missade</button>
      <button class="restart-btn" onclick="restart('missed')">Bara missade</button>
      <div class="save-row"><button class="save-btn" onclick="saveProgress()">Spara resultat</button></div>
    </div>
  </div>
</div>
<div id="index-overlay" class="index-overlay" hidden onclick="closeIndex(event)">
  <div class="index-panel" onclick="event.stopPropagation()">
    <div class="index-header">
      <h3>Alla kort</h3>
      <button class="index-close" onclick="closeIndex()">&times;</button>
    </div>
    <input class="index-search" id="index-search" type="text" placeholder="Sök kort..." oninput="renderIndex()">
    <div class="index-body" id="index-body"></div>
  </div>
</div>
<div class="progress-wrap">
  <div class="progress-inner">
    <div class="progress-label" id="progress-label">0 / 0</div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  </div>
</div>
<script>
const C=[
// ===== KIRURGI =====
{s:"KIR",n:"Kirurgi",p:"Var sitter spetsen på en CVK (central venkateter)?",a:"Övergången mellan <strong>vena cava superior och höger förmak</strong>."},
{s:"KIR",n:"Kirurgi",p:"Vad betyder urinretention och hur behandlas det?",a:"<strong>Överfyllnad av blåsan</strong> — kan inte tömmas. Behandling: <strong>urinkateter</strong>."},
{s:"KIR",n:"Kirurgi",p:"I vilken ordning ska man undersöka och behandla vid trauma?",a:"<strong>ABCDE:</strong> Airway → Breathing → Circulation → Disability → Exposure."},
{s:"KIR",n:"Kirurgi",p:"Vad är FRC, och hur ändras den från liggande till sittande?",a:"FRC = luftvolymen kvar efter <strong>normal utandning</strong> (inte maximal). FRC <strong>ökar</strong> från liggande till sittande."},
{s:"KIR",n:"Kirurgi",p:"Sekundära orsaker till lymfödem?",a:"<strong>Operation, strålbehandling, hudinfektion</strong>."},
{s:"KIR",n:"Kirurgi",p:"Vilka tre mål vill man uppnå med generell anestesi?",a:"(1) <strong>Medvetslöshet</strong>. (2) <strong>Smärtfrihet</strong>. (3) <strong>Muskelavslappning</strong>."},
{s:"KIR",n:"Kirurgi",p:"Vad är en lambå (flap)?",a:"Vävnad som <strong>flyttas med bevarad blodcirkulation</strong> för att täcka en defekt. Viktigast för lyckad operation: adekvat blodcirkulation."},
{s:"KIR",n:"Kirurgi",p:"Vanligaste cancerformen hos man respektive kvinna i Sverige?",a:"Man: <strong>prostatacancer</strong>. Kvinna: <strong>bröstcancer</strong>."},
{s:"KIR",n:"Kirurgi",p:"Laparoskopi vs laparotomi — tre nyckelfördelar?",a:"Laparoskopi: (1) <strong>mindre hudsnitt</strong>, (2) <strong>mindre postop smärta</strong>, (3) <strong>snabbare återhämtning</strong>. Laparoskopi = titthålskirurgi. Laparotomi = öppet snitt."},
{s:"KIR",n:"Kirurgi",p:"Skillnad delhudstransplantat (STSG) vs fullhudstransplantat (FTSG)?",a:"<strong>STSG:</strong> epidermis + del av dermis. <strong>FTSG:</strong> epidermis + hela dermis, bättre kosmetik."},
{s:"KIR",n:"Kirurgi",p:"Hur länge ska patienten fasta före planerad bukkirurgi?",a:"<strong>6 timmar</strong> fast föda, <strong>2 timmar</strong> klara drycker. Minskar aspirationsrisk."},
{s:"KIR",n:"Kirurgi",p:"Tre postoperativa lungkomplikationer efter öppen bukkirurgi?",a:"(1) <strong>Atelektaser</strong>. (2) <strong>Pneumoni</strong>. (3) <strong>Andningsinsufficiens</strong>."},
{s:"KIR",n:"Kirurgi",p:"Viktigaste FT-insatsen för att förebygga postop lungkomplikationer?",a:"<strong>Tidig mobilisering.</strong> Ökar FRC och mobiliserar sekret."},
{s:"KIR",n:"Kirurgi",p:"Bilateral bensvullnad, pitting, andfåddhet — diagnos?",a:"<strong>Hjärtsvikt</strong> (kardiellt ödem). Bilateral + pittande + andfåddhet. Behandling: diuretika."},
{s:"KIR",n:"Kirurgi",p:"Ensidig bensvullnad, Stemmers tecken, hudförtjockning — diagnos?",a:"<strong>Lymfödem.</strong> Behandling: <strong>kompression</strong>. Inte diuretika, inte vila."},
{s:"KIR",n:"Kirurgi",p:"Varför ska en nylagd trakeostomikanyl (<3 veckor) som åkt ut inte återinsättas?",a:"Kanalen inte stabiliserad → risk för <strong>falsk väg</strong>. Ventilera via mun/näsa och larma."},
{s:"KIR",n:"Kirurgi",p:"Gångträning vid claudicatio intermittens — rekommendation?",a:"Handledd gångträning ≥3 ggr/vecka, ≥30 min, ≥6 månader. Gå till smärtgräns, vila, fortsätt."},
{s:"KIR",n:"Kirurgi",p:"ERAS-konceptet — FT:s roll?",a:"Enhanced Recovery After Surgery. <strong>FT:s roll:</strong> preop information, tidig mobilisering (dag 0–1), andningsvård."},
{s:"KIR",n:"Kirurgi",p:"Riskfaktorer för postop lungkomplikationer?",a:"Låg kondition, nedsatt lungfunktion, öppen thorax-/bukkirurgi, lång op-tid, rökning, hög ålder."},
{s:"KIR",n:"Kirurgi",p:"Varför ska hematuri alltid utredas?",a:"Kan vara <strong>första tecknet på cancer</strong> i urinvägarna."},
{s:"KIR",n:"Kirurgi",p:"Rekonstruktionsstegen — princip?",a:"Från enklast till mest avancerat: (1) sutur → (2) sekundärläkning → (3) hudtransplantat → (4–6) lambåer. <strong>Välj enklaste metod som ger bra resultat.</strong>"},

// ===== ORTOPEDI =====
{s:"ORT",n:"Ortopedi",p:"72-årig man, ljumsksmärta, morgonstelhet, inskränkt inåtrotation/extension höger höft. Troligaste diagnos?",a:"<strong>Höftartros (coxartros).</strong> Typisk triad: ljumsksmärta + morgonstelhet + inskränkt inåtrotation/extension."},
{s:"ORT",n:"Ortopedi",p:"Förstahandsbehandling vid höft-/knäartros?",a:"<strong>Artrosskola</strong> — patientutbildning + individuellt träningsprogram + viktnedgång vid behov. Inte läkemedel, inte artroskopi, inte protes."},
{s:"ORT",n:"Ortopedi",p:"Vad ingår i artrosskola?",a:"Information om artros, råd om egenvård, <strong>individuellt utprovat träningsprogram</strong> med handledning. Inte samma sak som FAR."},
{s:"ORT",n:"Ortopedi",p:"Vilken indikation krävs för ledprotesoperation?",a:"<strong>Smärta + nedsatt livskvalitet</strong> trots konservativ behandling. Röntgenfynd allena räcker inte."},
{s:"ORT",n:"Ortopedi",p:"Högenergiskada — vad innebär det?",a:"Definieras av <strong>skademekanismen</strong>: t.ex. trafikolycka över 70 km/h med bälte (över 50 km/h utan), MC-olycka, påkörd fotgängare eller cyklist, fall från mer än 3 meter, klämskada mot bålen."},
{s:"ORT",n:"Ortopedi",p:"Patientens fot ser blek ut efter högenergiskada — vad misstänks?",a:"<strong>Kärlskada</strong> tills motsatsen bevisats. Blek fot = nedsatt blodförsörjning (inte nervskada)."},

{s:"ORT",n:"Ortopedi",p:"Behandling av dislocerad bimalleolär fotledsfraktur?",a:"<strong>Operation + gips.</strong> Enbart gips räcker inte vid dislokation."},
{s:"ORT",n:"Ortopedi",p:"Vilken komplikation är INTE allmän vid multitrauma? <span class='hint'>(Förlust av ben-/muskelmassa, lungemboli, tarmvred, DVT)</span>",a:"<strong>Tarmvred (ileus)</strong> — inte allmän vid multitrauma. Muskelatrofi, LE och DVT är klassiska komplikationer."},
{s:"ORT",n:"Ortopedi",p:"Callusläkning — vad är det?",a:"Läkning vid icke-opererade frakturer: hematom → <strong>mjuk kallus</strong> (brosk) → <strong>hård kallus</strong> (ben) → remodellering."},
{s:"ORT",n:"Ortopedi",p:"Vilket är INTE en röd flagga vid ryggsmärta? <span class='hint'>(Tablettbehandlad hypertoni, ålder >50, vilosmärta, SR >40, viktminskning)</span>",a:"<strong>Tablettbehandlad hypertoni</strong> — inget samband med allvarlig ryggsjukdom. Röda flaggor är t.ex. ålder över 50, vilo- och nattsmärta, viktminskning och förhöjd SR."},
{s:"ORT",n:"Ortopedi",p:"Axelluxation, kan inte dorsalflektera handleden dag 2. Vilken nervskada?",a:"<strong>N. radialis</strong> → dropphand. Skidtumme = UCL-skada, inte associerad med axelluxation."},

const SUBJECTS=[...new Set(C.map(c=>c.s))];
const SNAMES={};C.forEach(c=>SNAMES[c.s]=c.n);
const CNUM={};
const _sc={};C.forEach((c,i)=>{if(!_sc[c.s])_sc[c.s]=0;_sc[c.s]++;CNUM[i]=_sc[c.s]});

let activeSub=null,queue=[],cur=0,ratings={},counts={knew:0,unsure:0,missed:0},mode='shuffle';
const STORE_KEY='med1-fc-progress';

function loadProgress(){
  try{const d=localStorage.getItem(STORE_KEY);return d?JSON.parse(d):null}catch(e){return null}
}
function saveProgress(){
  try{
    const d={ratings:{},counts,ts:Date.now()};
    Object.keys(ratings).forEach(k=>{d.ratings[k]=ratings[k]});
    localStorage.setItem(STORE_KEY,JSON.stringify(d));
    const b=document.querySelector('.save-btn');if(b){b.textContent='Sparat!';setTimeout(()=>b.textContent='Spara resultat',1500)}
  }catch(e){}
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function buildPills(){
  const el=document.getElementById('pills');
  let h='<button class="pill'+(activeSub===null?' active':'')+'" onclick="filterSub(null)">Alla ('+C.length+')</button>';
  SUBJECTS.forEach(s=>{
    const cnt=C.filter(c=>c.s===s).length;
    h+='<button class="pill'+(activeSub===s?' active':'')+'" onclick="filterSub(\''+s+'\')">'+SNAMES[s]+' ('+cnt+')</button>';
  });
  el.innerHTML=h;
}
function filterSub(s){activeSub=s;buildPills();startSession()}

function setMode(m){
  mode=m;
  document.getElementById('mode-shuffle').classList.toggle('active',m==='shuffle');
  document.getElementById('mode-seq').classList.toggle('active',m==='seq');
  startSession();
}

function startSession(){
  const pool=activeSub===null?C:C.filter(c=>c.s===activeSub);
  const ids=pool.map(c=>C.indexOf(c));
  queue=mode==='shuffle'?shuffle(ids):ids;
  cur=0;ratings={};counts={knew:0,unsure:0,missed:0};
  document.getElementById('finish-area').hidden=true;document.getElementById('card-area').hidden=false;
  renderCard();
}

function openIndex(){
  document.getElementById('index-search').value='';
  renderIndex();
  document.getElementById('index-overlay').hidden=false;
  document.getElementById('index-search').focus();
}
function closeIndex(e){
  if(e&&e.target!==document.getElementById('index-overlay'))return;
  document.getElementById('index-overlay').hidden=true;
}
function renderIndex(){
  const q=(document.getElementById('index-search').value||'').toLowerCase();
  const pool=activeSub===null?C:C.filter(c=>c.s===activeSub);
  let h='';
  const groups={};
  pool.forEach(c=>{const ci=C.indexOf(c);if(!groups[c.s])groups[c.s]=[];groups[c.s].push(ci)});
  Object.keys(groups).forEach(s=>{
    const items=groups[s];
    const filtered=items.filter(ci=>{
      const c=C[ci];
      const label=(c.n+' '+CNUM[ci]+' '+c.p).toLowerCase();
      return !q||label.includes(q);
    });
    if(filtered.length===0)return;
    h+='<div class="index-group-label">'+SNAMES[s]+' ('+filtered.length+')</div>';
    filtered.forEach(ci=>{
      const c=C[ci];
      const plain=c.p.replace(/<[^>]*>/g,'');
      const short=plain.length>80?plain.slice(0,80)+'...':plain;
      let badge='';
      if(ratings[ci]){badge='<span class="index-item-badge '+ratings[ci]+'">'+(ratings[ci]==='knew'?'Kunde':ratings[ci]==='unsure'?'Osäker':'Missade')+'</span>'}
      h+='<div class="index-item" onclick="jumpTo('+ci+')"><span class="index-item-num">'+CNUM[ci]+'</span><span class="index-item-q">'+short+'</span>'+badge+'</div>';
    });
  });
  if(!h)h='<p style="color:var(--text-secondary);font-size:13px;padding:16px 0">Inga kort matchar sökningen.</p>';
  document.getElementById('index-body').innerHTML=h;
}
function jumpTo(ci){
  const idx=queue.indexOf(ci);
  if(idx!==-1){cur=idx}else{queue.push(ci);cur=queue.length-1}
  document.getElementById('index-overlay').hidden=true;
  document.getElementById('finish-area').hidden=true;
  document.getElementById('card-area').hidden=false;
  renderCard();
  window.scrollTo({top:0,behavior:'smooth'});
}

function restart(mode){
  let ids;
  if(mode==='missed')ids=Object.keys(ratings).filter(k=>ratings[k]==='missed').map(Number);
  else if(mode==='unsure')ids=Object.keys(ratings).filter(k=>ratings[k]==='unsure'||ratings[k]==='missed').map(Number);
  else ids=null;
  if(ids&&ids.length===0){startSession();return}
  if(ids){queue=shuffle(ids);cur=0;ratings={};counts={knew:0,unsure:0,missed:0};document.getElementById('finish-area').hidden=true;document.getElementById('card-area').hidden=false;renderCard()}
  else startSession();
}

function renderCard(){
  if(cur>=queue.length){showFinish();return}
  const ci=queue[cur],c=C[ci];
  document.getElementById('card-section').innerHTML='<span>'+c.n+'</span><span class="card-qnum">'+c.s+' '+CNUM[ci]+'</span>';
  document.getElementById('card-prompt').innerHTML=c.p;
  const aa=document.getElementById('answer-area');
  const rb=document.getElementById('reveal-btn');
  const rr=document.getElementById('rate-row');
  document.getElementById('prev-btn').hidden=cur===0;
  document.getElementById('next-btn').hidden=cur>=queue.length-1;
  if(ratings[ci]!==undefined){
    aa.innerHTML=c.a;aa.hidden=false;rb.hidden=true;rr.hidden=true;
  } else {
    aa.hidden=true;rb.hidden=false;rr.hidden=true;
  }
  updateStats();
}

function reveal(){
  const ci=queue[cur],c=C[ci];
  document.getElementById('answer-area').innerHTML=c.a;
  document.getElementById('answer-area').hidden=false;
  document.getElementById('reveal-btn').hidden=true;
  document.getElementById('rate-row').hidden=false;
}

function rate(r){
  const ci=queue[cur];
  ratings[ci]=r;counts[r]++;
  cur++;renderCard();
}

function go(dir){cur+=dir;if(cur<0)cur=0;renderCard()}

function updateStats(){
  document.getElementById('stat-num').textContent=Math.min(cur+1,queue.length);
  document.getElementById('stat-total').textContent=queue.length;
  document.getElementById('s-knew').textContent=counts.knew;
  document.getElementById('s-unsure').textContent=counts.unsure;
  document.getElementById('s-missed').textContent=counts.missed;
  const rated=counts.knew+counts.unsure+counts.missed;
  const p=queue.length>0?(rated/queue.length*100):0;
  document.getElementById('progress-fill').style.width=p+'%';
  document.getElementById('progress-label').textContent=rated+' / '+queue.length;
}

function showFinish(){
  document.getElementById('card-area').hidden=true;
  document.getElementById('finish-area').hidden=false;
  const t=counts.knew+counts.unsure+counts.missed;
  document.getElementById('final-msg').textContent=counts.knew+' kunde, '+counts.unsure+' osäkra, '+counts.missed+' missade av '+t;
  const ss={};
  queue.forEach(ci=>{const c=C[ci];if(!ss[c.s])ss[c.s]={n:c.n,k:0,u:0,m:0};const r=ratings[ci];if(r==='knew')ss[c.s].k++;else if(r==='unsure')ss[c.s].u++;else ss[c.s].m++});
  let bh='<h3>Per ämne</h3>';
  SUBJECTS.forEach(s=>{
    if(!ss[s])return;
    const st=ss[s];
    bh+='<div class="breakdown-row"><span class="breakdown-name">'+st.n+'</span><div class="breakdown-counts"><span class="c-knew">'+st.k+'</span><span class="c-unsure">'+st.u+'</span><span class="c-missed">'+st.m+'</span></div></div>';
  });
  document.getElementById('breakdown').innerHTML=bh;
  updateStats();
}

function cycleTheme(){var r=document.documentElement,l=r.getAttribute('data-theme')!=='light';if(l)r.setAttribute('data-theme','light');else r.removeAttribute('data-theme');try{localStorage.setItem('fysio-theme',l?'light':'dark')}catch(e){}themeLabel();}
function themeLabel(){document.getElementById('theme-btn').textContent=document.documentElement.getAttribute('data-theme')==='light'?'Mörkt läge':'Ljust läge';}
themeLabel();
buildPills();startSession();
</script>
</body>
</html>
