"o": ["Förmaksflimmer", "Förmaksfladder", "Sinustakykardi", "Kammarflimmer"], "c": 3, "e": "<strong>Rätt:<\/strong> vid <strong>kammarflimmer<\/strong> darrar kamrarna utan att pumpa — ingen hjärtminutvolym, alltså hjärtstopp. Kräver HLR och defibrillering.<br><strong>Varför inte de andra:<\/strong> förmaken står bara för en mindre del av kammarfyllnaden. Vid förmaksflimmer och fladder pumpar kamrarna fortfarande och patienten är vid medvetande. Sinustakykardi är normal rytm i snabb takt."}, {"s": "MED", "t": "Kardiologi", "q": "En patient med bröstsmärta har förhöjt troponin. EKG visar ingen ST-höjning, men ST-sänkningar. Vilket tillstånd?", "o": ["NSTEMI", "STEMI", "Instabil angina", "Stabil angina"], "c": 0, "e": "<strong>Rätt:<\/strong> <strong>NSTEMI<\/strong> — hjärtmuskelceller har dött (troponin stiger), men utan ST-höjning.<br><strong>Varför inte de andra:<\/strong> STEMI ger ST-höjning och innebär ett helt stängt kärl. Instabil angina ger <em>normalt<\/em> troponin, eftersom inga celler dött. Stabil angina är ansträngningsutlöst och går över i vila."}, {"s": "MED", "t": "Kardiologi", "q": "Vilken ejektionsfraktion definierar HFrEF (hjärtsvikt med reducerad ejektionsfraktion)?", "o": ["Under 40 %", "40–49 %", "50 % eller mer", "Under 55 %"], "c": 0, "e": "<strong>Rätt:<\/strong> HFrEF = EF <strong>under 40 %<\/strong>, systolisk svikt.<br><strong>Varför inte de andra:<\/strong> 40–49 % är HFmrEF. 50 % eller mer är HFpEF, där kontraktionen är normal men hjärtat är stelt. Normal EF är över 55 %, men värden strax under det räknas inte som HFrEF."}, {"s": "MED", "t": "Kardiologi", "q": "Vilken behandling är aktuell vid höggradigt AV-block?", "o": ["Pacemaker", "ICD (implanterbar defibrillator)", "Ablation", "Elkonvertering"], "c": 0, "e": "<strong>Rätt:<\/strong> vid höggradigt AV-block når få eller inga impulser kamrarna — rytmen blir för långsam. En <strong>pacemaker<\/strong> ger impulser när hjärtats egen rytm inte räcker. Detsamma gäller sjuk sinusknuta.<br><strong>Varför inte de andra:<\/strong> ICD är för livshotande <em>snabba<\/em> kammararytmier. Ablation och elkonvertering används vid takyarytmier."}, {"s": "MED", "t": "Kardiologi", "q": "Vilken är den viktigaste konsekvensen av förmaksflimmer?", "o": ["Ökad risk för stroke", "Hjärtstopp inom minuter", "Akut hjärtinfarkt", "Akut lungödem"], "c": 0, "e": "<strong>Rätt:<\/strong> blodet står stilla i de flimrande förmaken och kan bilda tromber som följer med till hjärnan — <strong>stroke<\/strong>. Därför ges antikoagulantia.<br><strong>Varför inte de andra:<\/strong> vid förmaksflimmer pumpar kamrarna fortfarande, så patienten får inget hjärtstopp. Infarkt och lungödem är inga typiska direkta följder."}, {"s": "MED", "t": "Lungsjukdomar", "q": "I vilken del av luftvägsträdet sker gasutbytet?", "o": ["Trachea", "Huvudbronker", "Bronker", "Bronkioler", "Alveoler"], "c": 4, "e": "<strong>Rätt:<\/strong> gasutbytet — respirationen — sker i <strong>alveolerna<\/strong>, där syre diffunderar in i kapillärerna och koldioxid ut.<br><strong>Varför inte de andra:<\/strong> trachea, bronker och bronkioler är ledande luftvägar som bara transporterar luften."}, {"s": "MED", "t": "Lungsjukdomar", "q": "Vilket anger bäst ett symtom på bronkiektasier utöver produktiv hosta och andfåddhet?", "o": ["Obstruktivitet (trånga luftrör)", "Viktnedgång", "Återkommande lunginflammationer", "Trötthet"], "c": 2, "e": "<strong>Rätt:<\/strong> bronkerna är permanent vidgade, slem blir kvar och koloniseras av bakterier — det ger <strong>återkommande lunginflammationer<\/strong>.<br><strong>Varför inte de andra:<\/strong> obstruktivitet är typiskt för KOL och astma. Viktnedgång och trötthet är ospecifika."}, {"s": "MED", "t": "Lungsjukdomar", "q": "Vad är mest karaktäristiskt vid en KOL-exacerbation, utöver ökad andfåddhet?", "o": ["Ökad slemproduktion", "Hög feber", "Bröstsmärta vid djupandning", "Torr hosta nattetid"], "c": 0, "e": "<strong>Rätt:<\/strong> <strong>ökad mängd slem<\/strong>, ofta missfärgat, tillsammans med mer hosta och andfåddhet.<br><strong>Varför inte de andra:<\/strong> hög feber hör inte typiskt till en exacerbation — det talar mer för pneumoni. Andningskorrelerad bröstsmärta talar för pleurit eller perikardit."}, {"s": "MED", "t": "Lungsjukdomar", "q": "Vilken är den viktigaste behandlingen vid nyupptäckt KOL?", "o": ["Rökstopp", "Inhalationssteroider", "Långtidssyrgas i hemmet", "Luftrörsvidgande inhalationer"], "c": 0, "e": "<strong>Rätt:<\/strong> <strong>rökstopp<\/strong> är det enda som bromsar sjukdomens förlopp. Utöver det förbättrar bara långtidssyrgas överlevnaden, och bara vid svår kronisk hypoxi.<br><strong>Varför inte de andra:<\/strong> inhalationer lindrar symtom men ändrar inte förloppet. Syrgas är inte aktuell vid nyupptäckt KOL."}, {"s": "MED", "t": "Lungsjukdomar", "q": "Vilket spirometrifynd talar för obstruktiv lungsjukdom?", "o": ["FEV1/FVC under 0,7", "Sänkt total lungkapacitet", "Sänkt FVC med normal kvot", "Förhöjd diffusionskapacitet"], "c": 0, "e": "<strong>Rätt:<\/strong> en <strong>FEV1/FVC-kvot under 0,7<\/strong> betyder att luften inte kommer ut tillräckligt snabbt — trånga luftrör, som vid KOL och astma.<br><strong>Varför inte de andra:<\/strong> sänkt total lungkapacitet (TLC) är ett <em>restriktivt<\/em> mönster, t.ex. lungfibros."}, {"s": "MED", "t": "Lungsjukdomar", "q": "Vad skiljer astma från KOL?", "o": ["Obstruktionen vid astma är reversibel", "Astma drabbar i princip bara barn", "Obstruktionen vid KOL är reversibel", "Astma orsakas främst av rökning"], "c": 0, "e": "<strong>Rätt:<\/strong> vid astma är obstruktionen <strong>varierande och reversibel<\/strong> — mellan skoven är lungfunktionen normal hos en välbehandlad patient. Vid KOL är skadorna bestående.<br><strong>Varför inte de andra:<\/strong> astma drabbar 8–10 % av vuxna. KOL:s obstruktion är irreversibel. Rökning är KOL:s dominerande riskfaktor."}, {"s": "MED", "t": "Pneumoni", "q": "Vilken bakterie orsakar flest lunginflammationer, i alla åldrar?", "o": ["Mycoplasma pneumoniae", "Staphylococcus aureus", "Streptococcus pneumoniae", "Pneumocystis jirovecii", "Haemophilus influenzae"], "c": 2, "e": "<strong>Rätt:<\/strong> <strong>Streptococcus pneumoniae<\/strong> (pneumokocker) — plötsligt insjuknande med frossa, hög feber och påverkat allmäntillstånd.<br><strong>Varför inte de andra:<\/strong> Mycoplasma drabbar främst 5–40-åringar och ger en mildare, utdragen bild. Haemophilus är vanligt vid KOL. S. aureus och Pneumocystis är ovanligare."}, {"s": "MED", "t": "Pneumoni", "q": "CRB-65 bedömer hur allvarlig en lunginflammation är. Förvirring, andningsfrekvens över 30 och lågt blodtryck är tre av faktorerna. Vilken är den fjärde?", "o": ["Ålder 65 år eller äldre", "Feber över 38,5 °C trots behandling", "CRP över 100 mg/L", "Syremättnad under 90 % i vila"], "c": 0, "e": "<strong>Rätt:<\/strong> <strong>ålder 65 år eller äldre<\/strong> — det är vad ”65” i namnet står för.<br><strong>Varför inte de andra:<\/strong> feber, CRP och saturation är viktiga vid bedömningen men ingår inte i CRB-65."}, {"s": "MED", "t": "Pneumoni", "q": "Cherryl, 27 år, har haft feber kring 38 grader och torrhosta i nästan två veckor. Hon är opåverkad, andningsfrekvens 25, blodtryck 120/75. Vilken orsak är troligast?", "o": ["Mycoplasma pneumoniae", "Streptococcus pneumoniae", "Haemophilus influenzae", "Staphylococcus aureus"], "c": 0, "e": "<strong>Rätt:<\/strong> <strong>Mycoplasma<\/strong> — ung patient, successivt insjuknande, utdragen torrhosta, låg feber och måttlig allmänpåverkan. CRB-65 ger 0 poäng, så hon kan behandlas i öppenvård.<br><strong>Varför inte de andra:<\/strong> pneumokocker ger plötsligt insjuknande med frossa, hög feber och påverkat allmäntillstånd. Haemophilus är typiskt vid KOL."}, {"s": "MED", "t": "Diabetes och metabola syndromet", "q": "Ungefär hur stor andel av den vuxna befolkningen i Sverige har diabetes?", "o": ["1 % (ca 100 000 personer)", "2,5 % (ca 250 000 personer)", "5 % (ca 500 000 personer)", "10 % (ca 1 000 000 personer)", "15 % (ca 1 500 000 personer)"], "c": 2, "e": "<strong>Rätt:<\/strong> <strong>ungefär 5 %, omkring 500 000 personer<\/strong>. 85–90 % har typ 2.<br><strong>Varför inte de andra:<\/strong> 10 % och uppåt är för högt för Sverige, och 1–2,5 % för lågt."}, {"s": "MED", "t": "Diabetes och metabola syndromet", "q": "Vilken riskfaktor måste per definition vara uppfylld för att en patient ska ha metabola syndromet?", "o": ["Hypertoni", "Bukfetma (enligt IDF 2005)", "Rökning", "Diabetes (enligt WHO 1998)", "Blodfettsrubbning"], "c": 1, "e": "<strong>Rätt:<\/strong> enligt IDF 2005 är <strong>bukfetma<\/strong> (midjemått) obligat, plus minst två av: förhöjt fasteglukos, högt blodtryck, lågt HDL och höga triglycerider.<br><strong>Varför inte de andra:<\/strong> hypertoni och blodfetter är tilläggskriterier. Rökning ingår inte. WHO:s äldre definition krävde diabetes eller insulinresistens, men IDF:s är den gängse."}, {"s": "MED", "t": "Diabetes och metabola syndromet", "q": "Vad är unikt för typ 1-diabetes jämfört med typ 2?", "o": ["Autoimmun förstörelse av betacellerna", "Starkare ärftlighet än vid typ 2-diabetes", "Stark koppling till övervikt och bukfetma", "Fler insjuknar med stigande ålder"], "c": 0, "e": "<strong>Rätt:<\/strong> typ 1 orsakas av att immunförsvaret <strong>förstör betacellerna<\/strong>, vilket ger absolut insulinbrist.<br><strong>Varför inte de andra:<\/strong> ärftligheten är tvärtom <strong>starkare vid typ 2<\/strong>, trots att typ 1 ofta uppfattas som den ärftliga formen. Koppling till övervikt och ökad risk med ålder gäller typ 2."}, {"s": "MED", "t": "Diabetes och metabola syndromet", "q": "Vilket läkemedel är förstahandsval vid typ 2-diabetes, efter livsstilsåtgärder?", "o": ["Metformin", "Insulin", "GLP-1-analog", "SGLT-2-hämmare"], "c": 0, "e": "<strong>Rätt:<\/strong> <strong>metformin<\/strong> minskar leverns glukosproduktion och ökar insulinkänsligheten. Det sätts in i anslutning till diagnos.<br><strong>Varför inte de andra:<\/strong> GLP-1-analoger och SGLT-2-hämmare är tillägg, särskilt vid hjärt-kärlsjukdom. Insulin kommer sent i behandlingstrappan vid typ 2."}, {"s": "MED", "t": "Diabetes och metabola syndromet", "q": "Vilket av följande värden ger diagnosen diabetes, om det bekräftas vid två tillfällen?", "o": ["HbA1c 48 mmol/mol", "HbA1c 42 mmol/mol", "Fasteglukos 6,1 mmol/L", "Glukos efter måltid 9,0 mmol/L"], "c": 0, "e": "<strong>Rätt:<\/strong> gränsen för HbA1c är <strong>48 mmol/mol<\/strong> eller högre.<br><strong>Varför inte de andra:<\/strong> gränsen för fasteglukos är 7,0 mmol/L och för glukos efter måltid 11,1 mmol/L (venöst). Värdena i de andra alternativen ligger under diagnosgränserna."}, {"s": "MED", "t": "Diabetes och metabola syndromet", "q": "Vad händer med blodsockret under ett vanligt träningspass på måttlig intensitet?", "o": ["Sjunker oftast — muskelarbete ökar glukosupptaget", "Stiger oftast — adrenalin frisätter glukos från levern", "Oförändrat — insulinfrisättningen ökar och kompenserar", "Sjunker bara hos den som behandlas med insulin"], "c": 0, "e": "<strong>Rätt:<\/strong> musklerna tar upp glukos <strong>utan att insulin behövs<\/strong>, och blodsockret sjunker oftast. Därför finns risk för hypoglykemi vid typ 1, även fördröjd nattetid.<br><strong>Varför inte de andra:<\/strong> det är bara vid mycket <em>högintensiv<\/em> träning som adrenalinet kan höja blodsockret. Insulinfrisättningen <em>minskar<\/em> vid träning. Effekten finns hos alla, inte bara hos insulinbehandlade."}, {"s": "MED", "t": "Diabetes och metabola syndromet", "q": "Vad är basalinsulinets uppgift vid typ 1-diabetes?", "o": ["Bromsa leverns glukosproduktion mellan måltiderna", "Sänka blodsockret som stiger direkt efter en måltid", "Öka musklernas glukosupptag i samband med träning", "Snabbt häva en pågående hypoglykemi"], "c": 0, "e": "<strong>Rätt:<\/strong> basalinsulinet är långverkande och ger en jämn grundnivå som <strong>bromsar leverns glukosproduktion och fettnedbrytningen mellan måltiderna<\/strong>.<br><strong>Varför inte de andra:<\/strong> blodsockerstegringen efter maten tas om hand av det snabbverkande <em>måltidsinsulinet<\/em>. Hypoglykemi hävs med snabba kolhydrater — insulin förvärrar den."}, {"s": "MED", "t": "Venös tromboembolism", "q": "Hur stor andel av dem som får venös tromboembolism får ett återfall inom fem år?", "o": ["0–10 %", "20–30 %", "50–60 %", "70–80 %", "100 %"], "c": 1, "e": "<strong>Rätt:<\/strong> <strong>20–30 %<\/strong> — ungefär var fjärde till var femte patient.<br><strong>Varför inte de andra:<\/strong> risken är klart högre än 10 % men långt ifrån hälften."}, {"s": "MED", "t": "Venös tromboembolism", "q": "Vilka faktorer ingår i den triad som förklarar varför venös trombos uppstår?", "o": ["Ärftlighet, venklaffsdysfunktion, endotelskada", "Hyperkoagulabilitet, venös stas, yttre trauma", "Ärftlighet, venklaffsdysfunktion, yttre trauma", "Hyperkoagulabilitet, venös stas, endotelskada"], "c": 3, "e": "<strong>Rätt:<\/strong> Virchows triad är <strong>hyperkoagulabilitet, venös stas och endotelskada<\/strong>.<br><strong>Varför inte de andra:<\/strong> ärftlighet kan ge hyperkoagulabilitet och trauma kan ge endotelskada — de <em>bidrar<\/em>, men de är inte själva triadens komponenter. Venklaffsdysfunktion är en följd av trombos (posttrombotiskt syndrom), inte en del av triaden."}, {"s": "MED", "t": "Venös tromboembolism", "q": "Vilket fynd talar för djup ventrombos i benet?", "o": ["Palpationsömhet längs det djupa vensystemet", "Blek, kall fot med långsam kapillär återfyllnad", "Blåmarmorerad hud på båda benen", "Försvagade eller saknade fotpulsar"], "c": 0, "e": "<strong>Rätt:<\/strong> DVT ger ensidig bensvullnad, ökad venteckning och <strong>ömhet längs det djupa vensystemet<\/strong>, ibland rodnad och värme.<br><strong>Varför inte de andra:<\/strong> blek och kall hud, marmorering och svaga pulsar talar för ett <em>arteriellt<\/em> problem, inte venöst."}, {"s": "MED", "t": "Venös tromboembolism", "q": "Hur stor andel av dem som haft en djup ventrombos utvecklar posttrombotiskt syndrom?", "o": ["20–50 %", "Under 5 %", "5–10 %", "Över 80 %"], "c": 0, "e": "<strong>Rätt:<\/strong> <strong>20–50 %<\/strong>. Proppen skadar venklaffarna, blodet stockar sig och ger kronisk smärta, svullnad, hudförändringar och i svåra fall bensår. Tidig mobilisering och kompression förebygger.<br><strong>Varför inte de andra:<\/strong> komplikationen är betydligt vanligare än 10 %, men drabbar inte de allra flesta."}, {"s": "MED", "t": "Venös tromboembolism", "q": "En patient har låg klinisk sannolikhet för DVT enligt Wells score, och D-dimer är normal. Vad innebär det?", "o": ["DVT kan i princip uteslutas", "DVT är bekräftad och ska behandlas", "Ultraljud måste ändå göras", "Blodförtunnande ska ges i förebyggande syfte"], "c": 0, "e": "<strong>Rätt:<\/strong> D-dimer är känsligt men ospecifikt. Ett <strong>normalt<\/strong> värde tillsammans med låg sannolikhet räcker för att <strong>utesluta<\/strong> DVT.<br><strong>Varför inte de andra:<\/strong> ett förhöjt D-dimer bevisar ingenting, och diagnosen ställs med ultraljud. Vid hög sannolikhet går man direkt till ultraljud."}, {"s": "REU", "t": "Utredning och symtom", "q": "I vilken ordning utför reumatologen en utredning?", "o": ["Anamnes → klinisk undersökning → blodprover → röntgen/MR", "Blodprover → anamnes → klinisk undersökning → röntgen/MR", "Anamnes → blodprover → röntgen/MR → klinisk undersökning", "Klinisk undersökning → anamnes → röntgen/MR → blodprover"], "c": 0, "e": "<strong>Rätt:<\/strong> <strong>anamnes först<\/strong> — symtommönster, morgonstelhet, duration — sedan <strong>klinisk undersökning<\/strong> av leder, muskler och hud, därefter <strong>blodprover<\/strong> och sist <strong>bilddiagnostik<\/strong>.<br><strong>Varför inte de andra:<\/strong> prover och bilder beställs utifrån vad anamnes och undersökning väckt misstanke om — de kommer inte först. Diagnosen är i grunden klinisk."}, {"s": "REU", "t": "Utredning och symtom", "q": "Vilka två symtom gäller för de allra flesta patienter med inflammatoriska reumatiska tillstånd?", "o": ["Smärta och trötthet", "Smärta och ledinflammation", "Trötthet och muskelsvaghet", "Ledinflammation och hjärtsäcksinflammation"], "c": 0, "e": "<strong>Rätt:<\/strong> <strong>smärta och trötthet<\/strong> är gemensamma för i stort sett alla inflammatoriska reumatiska tillstånd.<br><strong>Varför inte de andra:<\/strong> ledinflammation saknas vid många systemsjukdomar och myositer. Muskelsvaghet är typiskt för myosit men inte för RA. Hjärtsäcksinflammation förekommer vid vissa diagnoser men långt ifrån hos alla."}, {"s": "REU", "t": "Läkemedel", "q": "Vilken kombination av läkemedelstyp och biverkan stämmer?", "o": ["Kortison — osteoporos", "Metotrexat — reaktivering av tuberkulos", "TNF-hämmare — näthinneskada", "Hydroxiklorokin — bältros"], "c": 0, "e": "<strong>Rätt:<\/strong> <strong>kortison ger osteoporos<\/strong>, liksom högt blodsocker, infektionskänslighet och Cushingoid habitus.<br><strong>Varför inte de andra:<\/strong> tuberkulosreaktivering hör till <em>TNF-hämmare<\/em>. Näthinneskada hör till <em>hydroxiklorokin<\/em>. Bältros är typiskt för <em>JAK-hämmare<\/em>. Metotrexat ger leverpåverkan, påverkan på blodbildningen och fosterskador."}, {"s": "REU", "t": "Läkemedel", "q": "Vad måste göras innan behandling med en TNF-hämmare påbörjas?", "o": ["Screening för latent tuberkulos", "Mätning av bentätheten med DXA", "Ögonundersökning av näthinnan hos ögonläkare", "Blodprov för reumatoid faktor"], "c": 0, "e": "<strong>Rätt:<\/strong> TNF-alfa behövs för att hålla en latent tuberkulos i schack, så <strong>tuberkulosscreening är obligatorisk<\/strong> före start.<br><strong>Varför inte de andra:<\/strong> bentäthet följs vid långvarig kortisonbehandling. Ögonundersökning görs vid hydroxiklorokin. Reumatoid faktor är ett diagnostiskt prov, inte en säkerhetskontroll."}, {"s": "REU", "t": "Läkemedel", "q": "Vilka är de viktigaste biverkningarna av metotrexat?", "o": ["Leverpåverkan och fosterskador", "Osteoporos och högt blodsocker", "Reaktivering av tuberkulos", "Näthinneskada och synpåverkan"], "c": 0, "e": "<strong>Rätt:<\/strong> metotrexat kan ge <strong>leverskada<\/strong> (regelbundna leverprover), påverkan på blodbildningen, illamående och <strong>fosterskador<\/strong> — det är absolut kontraindicerat vid graviditet.<br><strong>Varför inte de andra:<\/strong> osteoporos och högt blodsocker är kortisonbiverkningar. Tuberkulosreaktivering hör till TNF-hämmare. Näthinneskada till hydroxiklorokin."}, {"s": "REU", "t": "Läkemedel", "q": "Varför kan en infektion vara svår att upptäcka hos en patient som behandlas med IL-6-blockad?", "o": ["CRP stiger inte som vanligt vid infektion", "Läkemedlet höjer CRP även utan infektion", "Läkemedlet ger feber som döljer infektionen", "Vita blodkroppar stiger kraftigt utan infektion"], "c": 0, "e": "<strong>Rätt:<\/strong> IL-6 driver leverns CRP-produktion. När IL-6 blockeras <strong>stiger inte CRP<\/strong> — det vanliga labtecknet på infektion kan vara falskt normalt.<br><strong>Varför inte de andra:<\/strong> läkemedlet sänker CRP och dämpar inflammationssvaret; det ger inte feber eller stigande vita blodkroppar."}, {"s": "REU", "t": "Reumatoid artrit", "q": "En kvinna i 50-årsåldern har värk i MCP- och PIP-lederna som kommer och går. Flera leder är svullna, både på höger och vänster hand. Vilket tillstånd misstänker du?", "o": ["Reumatoid artrit", "Artros i handens leder", "Psoriasisartrit", "Giktartrit i fingerlederna"], "c": 0, "e": "<strong>Rätt:<\/strong> <strong>RA<\/strong> — symmetrisk inflammation i händernas små leder (MCP och PIP) hos en medelålders kvinna.<br><strong>Varför inte de andra:<\/strong> handartros sitter typiskt i DIP-leder och tumbas och ger inte svullna, inflammerade MCP-leder. Psoriasisartrit drabbar ofta DIP-leder och är ofta asymmetrisk. Gikt ger akuta attacker i en led."}, {"s": "REU", "t": "Reumatoid artrit", "q": "Vilka två inre organ drabbas oftast vid reumatoid artrit?", "o": ["Lungor och hjärta", "Njurar och lever", "Tarm och bukspottkörtel", "Sköldkörtel och binjurar"], "c": 0, "e": "<strong>Rätt:<\/strong> <strong>lungorna<\/strong> (lungfibros, lungsäcksinflammation, reumatiska noduli) och <strong>hjärtat<\/strong> (hjärtsäcksinflammation, accelererad ateroskleros). Kardiovaskulär sjukdom är den vanligaste dödsorsaken vid RA.<br><strong>Varför inte de andra:<\/strong> njurpåverkan förekommer vid långvarig svår RA (amyloidos) men är inte typiskt. Tarm, lever och körtlar är inga typiska RA-organ."}, {"s": "REU", "t": "Reumatoid artrit", "q": "Vilka leder drabbas i princip aldrig vid reumatoid artrit?", "o": ["DIP-lederna", "MCP-lederna", "PIP-lederna", "MTP-lederna"], "c": 0, "e": "<strong>Rätt:<\/strong> <strong>DIP-lederna<\/strong> (fingrarnas yttersta leder). Där sitter i stället Heberdens artros eller psoriasisartrit.<br><strong>Varför inte de andra:<\/strong> MCP, PIP och fötternas MTP-leder är just RA:s typiska debutleder."}, {"s": "REU", "t": "Reumatoid artrit", "q": "Vad bör du göra innan du behandlar nacken hos en patient med reumatoid artrit?", "o": ["Utesluta instabilitet i övre halsryggen med röntgen", "Börja med manipulation för att öka rörligheten i nacken", "Kontrollera att reumatoid faktor är negativ", "Vänta tills sjukdomen är i remission"], "c": 0, "e": "<strong>Rätt:<\/strong> RA kan lucka upp ligamenten mellan C1 och C2 (<strong>atlantoaxial subluxation<\/strong>). Manipulation kan då komprimera ryggmärgen, i värsta fall med andningsstillestånd. En färsk röntgen ska utesluta överrörlighet.<br><strong>Varför inte de andra:<\/strong> manipulation utan röntgen är farligt. RF-status och remission säger inget om halsryggens stabilitet."}, {"s": "REU", "t": "Reumatoid artrit", "q": "En patient har morgonstelhet i händerna som varar mer än en timme. Vad talar det för?", "o": ["Inflammatorisk ledsjukdom, t.ex. RA", "Artros i fingrarnas och tumbasens leder", "Tendinopati i fingrarnas böjsenor", "Karpaltunnelsyndrom"], "c": 0, "e": "<strong>Rätt:<\/strong> morgonstelhet över <strong>en timme<\/strong> är typiskt för <strong>inflammatorisk<\/strong> ledsjukdom.<br><strong>Varför inte de andra:<\/strong> vid artros går stelheten över inom ungefär 30 minuter. Tendinopati och karpaltunnelsyndrom ger inte långvarig morgonstelhet."}, {"s": "REU", "t": "Spondylartriter", "q": "Vilken anamnesuppgift talar för ankyloserande spondylit snarare än degenerativa ryggbesvär?", "o": ["Smärtan blir bättre av rörelse och sämre av vila", "Smärtan debuterade efter 60 års ålder", "Smärtan blir bättre av vila och sämre av belastning", "Morgonstelheten går över inom tio minuter"], "c": 0, "e": "<strong>Rätt:<\/strong> inflammatorisk ryggsmärta <strong>förbättras av rörelse<\/strong> och förvärras av vila. Andra ledtrådar: debut före 40 års ålder, smygande debut, besvär i mer än tre månader, nattlig smärta som tvingar upp patienten och morgonstelhet över 30 minuter.<br><strong>Varför inte de andra:<\/strong> sen debut, lindring av vila och kort morgonstelhet talar för mekanisk, degenerativ ryggsmärta."}, {"s": "REU", "t": "Spondylartriter", "q": "Vilket är farmakologiskt förstahandsval vid ankyloserande spondylit?", "o": ["NSAID", "Metotrexat", "Kortison i tablettform", "Hydroxiklorokin"], "c": 0, "e": "<strong>Rätt:<\/strong> <strong>NSAID<\/strong>, tillsammans med fysioterapi och kombinationsträning som grundpelare. Vid otillräcklig effekt blir TNF-hämmare aktuella.<br><strong>Varför inte de andra:<\/strong> metotrexat har begränsad effekt på ryggsjukdomen vid AS, till skillnad från vid RA. Kortison och hydroxiklorokin är inte förstahandsval här."}, {"s": "REU", "t": "Spondylartriter", "q": "Daktylit (”korvfinger”) och artrit i DIP-lederna talar för vilken diagnos?", "o": ["Psoriasisartrit", "Reumatoid artrit", "Systemisk lupus erythematosus", "Polymyalgia reumatica"], "c": 0, "e": "<strong>Rätt:<\/strong> <strong>psoriasisartrit<\/strong>. Daktylit förekommer nästan bara där bland artritsjukdomarna, och DIP-ledsartrit är typiskt för psoriasisartrit och artros.<br><strong>Varför inte de andra:<\/strong> RA drabbar i princip aldrig DIP-leder. SLE-artrit ger inte daktylit. PMR ger värk i skulder- och bäckengördel."}, {"s": "REU", "t": "Artriter", "q": "Vad skiljer reaktiv artrit från infektiös (septisk) artrit?", "o": ["Vid reaktiv artrit är leden steril", "Vid reaktiv artrit finns bakterier i leden", "Reaktiv artrit behandlas med antibiotika i leden", "Reaktiv artrit är ett akuttillstånd med hög dödlighet"], "c": 0, "e": "<strong>Rätt:<\/strong> vid reaktiv artrit sitter infektionen <strong>någon annanstans<\/strong> (tarm, urinvägar, luftvägar) och ger en immunreaktion — <strong>leden är steril<\/strong>. Den behandlas med immundämpande och är ofta självbegränsande.<br><strong>Varför inte de andra:<\/strong> bakterier i leden, antibiotika och hög dödlighet (10–15 %) beskriver <em>infektiös<\/em> artrit, som är ett akuttillstånd."}, {"s": "REU", "t": "Artriter", "q": "En man vaknar med akut, mycket kraftig smärta, svullnad och rodnad i stortåns grundled. Mellan attackerna är han besvärsfri. Troligaste diagnos?", "o": ["Gikt", "Septisk artrit", "Reumatoid artrit", "Hallux rigidus"], "c": 0, "e": "<strong>Rätt:<\/strong> <strong>gikt<\/strong> — uratkristaller fälls ut i leden och ger en attack som når maximal intensitet inom timmar, klassiskt i stortåns grundled. Mellan attackerna är patienten besvärsfri.<br><strong>Varför inte de andra:<\/strong> septisk artrit ger också akut monoartrit, oftast i en stor led med feber — därför görs alltid ledpunktion. RA är symmetrisk och kronisk. Hallux rigidus är artros med stelhet, inte attacker."}, {"s": "REU", "t": "Artriter", "q": "Vad ska alltid göras vid en snabbt uppkommen monoartrit med kraftig inflammation?", "o": ["Ledpunktion för odling och kristallanalys", "Kortisoninjektion direkt i leden", "Behandling med NSAID i en vecka och sedan ny bedömning", "Röntgen och uppföljning efter svaret"], "c": 0, "e": "<strong>Rätt:<\/strong> <strong>ledpunktion<\/strong> — odling för att utesluta infektiös artrit och kristallanalys för att påvisa gikt. Tillstånden kräver helt olika behandling, och infektiös artrit kan förstöra brosket på några dagar.<br><strong>Varför inte de andra:<\/strong> kortison i en infekterad led är farligt. Att avvakta med NSAID eller röntgen fördröjer en akut diagnos."}, {"s": "REU", "t": "Systemsjukdomar", "q": "SLE kan drabba många organsystem. Vilken kombination kan drabbas utöver hud och leder?", "o": ["Njurar, hjärta och lungor, blod, CNS", "Lever, bukspottkörtel, tarm, sköldkörtel", "Njurar, lever, binjurar, testiklar", "Hjärta, lungor, sköldkörtel, prostata"], "c": 0, "e": "<strong>Rätt:<\/strong> <strong>njurar<\/strong> (lupusnefrit), <strong>hjärta och lungor<\/strong> (serosit — pleurit och perikardit), <strong>blod<\/strong> (anemi, leukopeni, trombocytopeni) och <strong>centrala nervsystemet<\/strong>. Mag-tarmkanalen kan också drabbas.<br><strong>Varför inte de andra:<\/strong> immunkomplex kan fastna i nästan alla vävnader, men lever, bukspottkörtel och de hormonproducerande körtlarna är inte SLE:s typiska organ."}, {"s": "REU", "t": "Systemsjukdomar", "q": "Vilket labfynd är typiskt vid SLE?", "o": ["Hög SR men ofta normalt CRP", "Högt CRP men normal SR", "Positiv anti-CCP och reumatoid faktor", "Kraftigt förhöjt CK och myoglobin"], "c": 0, "e": "<strong>Rätt:<\/strong> SR är ofta <strong>hög<\/strong> på grund av höga immunoglobulinnivåer, medan CRP <strong>inte stiger nämnvärt<\/strong> — en diskrepans som kan hjälpa diagnostiskt. ANA är nästan alltid positiv.<br><strong>Varför inte de andra:<\/strong> anti-CCP är specifik för reumatoid artrit. Förhöjt CK talar för myosit."}, {"s": "REU", "t": "Systemsjukdomar", "q": "En man söker för stram hud på händerna, andfåddhet och torrhosta vid ansträngning. Troligaste diagnos?", "o": ["Systemisk skleros", "Dermatomyosit", "Sjögrens syndrom", "Systemisk lupus erythematosus"], "c": 0, "e": "<strong>Rätt:<\/strong> <strong>systemisk skleros<\/strong>. Stram, förtjockad hud på händerna (sklerodaktyli) tillsammans med torrhosta och andfåddhet talar för lungfibros — lungengagemang är den viktigaste orsaken till förkortad livslängd.<br><strong>Varför inte de andra:<\/strong> dermatomyosit ger muskelsvaghet och utslag, inte stram hud. Sjögren ger torrhet i ögon och mun. SLE ger fjärilsexantem, inte sklerodaktyli."}, {"s": "REU", "t": "Systemsjukdomar", "q": "Vad talar för sekundärt, snarare än primärt, Raynauds fenomen?", "o": ["Debut i vuxen ålder med sår på fingertopparna", "Debut i tonåren utan några sår", "Enbart vit fas vid kyla, utan blå och röd fas", "Normal kapillärmikroskopi i nagelbädden"], "c": 0, "e": "<strong>Rätt:<\/strong> sekundärt Raynaud <strong>debuterar i vuxen ålder<\/strong>, är ofta tre- eller tvåfasiskt och ger risk för <strong>digitala sår<\/strong> och nekros. Det är associerat med systemsjukdom, t.ex. systemisk skleros.<br><strong>Varför inte de andra:<\/strong> debut i ung ålder, bara en fas och normal kapillärmikroskopi talar för det godartade primära Raynaud."}, {"s": "REU", "t": "Systemsjukdomar", "q": "En kvinna har torra ögon med sveda, torr mun med svårt att svälja, förstorade spottkörtlar och uttalad trötthet. Troligaste diagnos?", "o": ["Sjögrens syndrom", "Systemisk lupus erythematosus", "Systemisk skleros", "Sarkoidos"], "c": 0, "e": "<strong>Rätt:<\/strong> <strong>Sjögrens syndrom<\/strong> — immunförsvaret angriper saliv- och tårkörtlarna och ger torrhet (sicca). Tröttheten är ofta det mest besvärande symtomet. Anti-SSA och anti-SSB är typiska antikroppar.<br><strong>Varför inte de andra:<\/strong> SLE och systemisk skleros kan ge <em>sekundär<\/em> Sjögren, men ger då också sina egna huvudsymtom. Sarkoidos drabbar främst lungor och lymfkörtlar."}, {"s": "REU", "t": "Systemsjukdomar", "q": "En patient har svullna fingrar, Raynauds fenomen, artrit och myosit, och en specifik autoantikropp. Sjukdomen svarar väl på låga doser kortison. Vilken diagnos?", "o": ["MCTD (mixed connective tissue disease)", "Reumatoid artrit med sekundär Sjögren", "Polymyalgia reumatica med jättecellsarterit", "Psoriasisartrit med daktylit"], "c": 0, "e": "<strong>Rätt:<\/strong> <strong>MCTD<\/strong> — den mest sällsynta systemsjukdomen, en blandning av drag från SLE, systemisk skleros och myosit, definierad av en specifik autoantikropp. Den svarar oftast bra på lägre doser kortison och immundämpande.<br><strong>Varför inte de andra:<\/strong> RA ger inte myosit eller Raynaud som huvudbild. PMR ger stelhet i skulder- och bäckengördel. Psoriasisartrit hör ihop med hudpsoriasis."}, {"s": "REU", "t": "Myosit", "q": "En man i 60-årsåldern har sedan flera år tilltagande muskelsvaghet. Han har ramlat, har svårt att resa sig från sittande och att greppa föremål. Du ser atrofi över quadriceps och han har svårt att böja fingrarna. Troligaste diagnos?", "o": ["Inklusionskroppsmyosit", "Polymyalgia reumatica", "Dermatomyosit med lungengagemang", "Polymyosit"], "c": 0, "e": "<strong>Rätt:<\/strong> <strong>inklusionskroppsmyosit (IBM)<\/strong> — man över 50, långsamt förlopp under flera år, typiskt mönster med <strong>quadriceps<\/strong> (fall, svårt att resa sig) och <strong>fingerflexorer<\/strong> (svårt att greppa), och synlig atrofi.<br><strong>Varför inte de andra:<\/strong> polymyosit ger symmetrisk <em>proximal<\/em> svaghet utan fingerflexorerna. Dermatomyosit ger dessutom hudutslag. PMR ger värk och stelhet, inte svaghet och atrofi."}, {"s": "REU", "t": "Myosit", "q": "En kvinna har tilltagande muskelsvaghet, andfåddhet och rödaktiga utslag över MCP- och PIP-lederna. Vilken diagnos och primär behandling?", "o": ["Dermatomyosit — kortison och immunsuppressiva", "Dermatomyosit — enbart anpassad träning", "SLE — hydroxiklorokin, solskydd och NSAID vid behov", "Systemisk skleros — kärlvidgande läkemedel"], "c": 0, "e": "<strong>Rätt:<\/strong> <strong>dermatomyosit<\/strong> — utslagen över knogarna är Gottrons papler, och andfåddheten talar för lungengagemang. Behandlingen är <strong>kortison plus immunsuppressivt<\/strong> läkemedel, t.ex. metotrexat eller azatioprin. Träning är ett viktigt komplement från dag ett.<br><strong>Varför inte de andra:<\/strong> enbart träning räcker inte vid aktiv dermatomyosit. SLE ger fjärilsexantem, inte Gottrons papler. Systemisk skleros ger stram hud."}, {"s": "REU", "t": "Myosit", "q": "Vilken är den viktigaste interventionen vid inklusionskroppsmyosit?", "o": ["Anpassad träning", "Högdos kortison under ett år", "Metotrexat en gång i veckan", "TNF-hämmare"], "c": 0, "e": "<strong>Rätt:<\/strong> IBM svarar dåligt eller inte alls på immunsuppression, så <strong>träning<\/strong> är den viktigaste interventionen — för att bevara funktion, förebygga fall och vid behov med hjälpmedel.<br><strong>Varför inte de andra:<\/strong> kortison och metotrexat fungerar vid polymyosit och dermatomyosit, men inte vid IBM. TNF-hämmare används vid RA och spondylartrit."}, {"s": "REU", "t": "Vaskulit", "q": "En 75-åring har nytillkommen huvudvärk, ömhet i hårbotten och smärta i käken när hon tuggar. SR är hög. Vad gäller?", "o": ["Högdos kortison direkt, utan att invänta biopsi", "Temporalisbiopsi först, behandling efter svaret", "NSAID och ny kontroll om två veckor", "Remiss till fysioterapi för käkträning"], "c": 0, "e": "<strong>Rätt:<\/strong> bilden är typisk för <strong>jättecellsarterit (temporalisarterit)<\/strong>. Den allvarligaste komplikationen är plötslig, bestående blindhet. Därför ges <strong>högdos kortison redan vid stark misstanke<\/strong>, utan att vänta på biopsin.<br><strong>Varför inte de andra:<\/strong> att vänta på biopsisvar eller ge NSAID riskerar synen. Smärtan vid tuggning är ischemi i tuggmuskulaturen, inte ett käkledsproblem."}, {"s": "REU", "t": "Vaskulit", "q": "En 70-åring har symmetrisk värk och stelhet i skuldror och höfter, värst på morgonen. SR är hög, och kortison ger dramatisk förbättring inom några dagar. Diagnos?", "o": ["Polymyalgia reumatica", "Polymyosit", "Reumatoid artrit", "Artros i axlar och höfter"], "c": 0, "e": "<strong>Rätt:<\/strong> <strong>polymyalgia reumatica<\/strong> — drabbar personer över 50, symmetrisk värk och stelhet i skulder- och bäckengördeln, hög SR och ett snabbt svar på kortison. Kan förekomma tillsammans med jättecellsarterit.<br><strong>Varför inte de andra:<\/strong> polymyosit ger svaghet och förhöjt CK, inte främst värk och stelhet. RA drabbar händernas små leder. Artros ger inte hög SR eller kortisonsvar."}, {"s": "GYN", "t": "Hormoner och testosteron", "q": "Om unga personer i puberteten använder anabola steroider kan de stanna i växten och bli 5–10 cm kortare som vuxna. Vad orsakar detta?", "o": ["Minskad bentäthet i rörbenen under tillväxten", "En ökning av antalet osteoklaster i skelettet", "För tidig tillslutning av skelettets tillväxtzoner", "Obalans mellan muskelhypertrofi och bentillväxt", "Förstorade epifyser som trycker på tillväxtzonen"], "c": 2, "e": "<strong>Rätt:<\/strong> de höga androgennivåerna omvandlas delvis till östrogen (aromatisering), och östrogen stänger tillväxtzonerna. Zonerna <strong>sluts i förtid<\/strong> och längdtillväxten avbryts.<br><strong>Varför inte de andra:<\/strong> det är den tidiga epifysslutningen som stoppar tillväxten — inte minskad bentäthet, osteoklaster eller muskelhypertrofi."}, {"s": "GYN", "t": "Hormoner och testosteron", "q": "Hur påverkar anabola androgena steroider kroppens egen testosteronproduktion?", "o": ["Den minskar — hypothalamus stänger av signalerna till testiklarna", "Den ökar — testiklarna stimuleras direkt av det tillförda hormonet", "Den påverkas inte — steroiderna verkar bara lokalt i musklerna", "Den ökar tillfälligt och normaliseras inom några veckor"], "c": 0, "e": "<strong>Rätt:<\/strong> testosteron regleras med <strong>negativ återkoppling<\/strong>. Hypothalamus uppfattar de höga nivåerna som att det redan finns tillräckligt, stänger av GnRH, hypofysen slutar skicka LH, och <strong>testiklarnas egen produktion sjunker<\/strong>.<br><strong>Varför inte de andra:<\/strong> steroiderna verkar i hela kroppen via blodet, och systemet svarar på höga nivåer genom att minska — inte öka — den egna produktionen."}, {"s": "GYN", "t": "Hormoner och testosteron", "q": "Vilket hormon anses vara orsaken till PMDS (premenstruellt dysforiskt syndrom)?", "o": ["Progesteron", "Östrogen", "Testosteron", "FSH"], "c": 0, "e": "<strong>Rätt:<\/strong> <strong>progesteron<\/strong>, som bildas efter ägglossningen, anses orsaka PMDS — svåra humörsvängningar, irritabilitet och nedstämdhet under lutealfasen.<br><strong>Varför inte de andra:<\/strong> östrogen, testosteron och FSH har andra huvuduppgifter i cykeln och är inte orsaken till PMDS."}, {"s": "GYN", "t": "Hormoner och testosteron", "q": "Vad stämmer om PCOS (polycystiskt ovariesyndrom)?", "o": ["En vanlig orsak till mensrubbning och svårighet att bli gravid", "Ett sällsynt tillstånd som ger tidig menopaus före 40 års ålder", "En infektion i äggledarna som ger ensidig buksmärta", "Ett tillstånd som främst drabbar underviktiga idrottare"], "c": 0, "e": "<strong>Rätt:<\/strong> PCOS drabbar 5–10 % av kvinnor i fertil ålder och är en av de <strong>vanligaste orsakerna till mensrubbning<\/strong>. Ägglossningen uteblir eller är sällsynt, vilket gör det svårt att bli gravid. Vid övervikt förbättrar viktnedgång hormonbalansen.<br><strong>Varför inte de andra:<\/strong> tidig menopaus före 40 är prematur ovariell insufficiens. Äggledarinfektion är något annat. Underviktiga idrottare drabbas av hypotalamisk amenorré, inte PCOS."}, {"s": "GYN", "t": "Hormoner och testosteron", "q": "Mot vilken cancerform skyddar kombinerade p-piller?", "o": ["Äggstockscancer", "Bröstcancer", "Livmoderhalscancer", "Lungcancer"], "c": 0, "e": "<strong>Rätt:<\/strong> p-piller förebygger <strong>äggstockscancer<\/strong> (ingen ägglossning) och skyddar även mot endometriecancer och minskar risken för koloncancer.<br><strong>Varför inte de andra:<\/strong> livmoderhalscancer orsakas av HPV och förebyggs med vaccin och cellprovskontroller. Bröst- och lungcancer skyddar p-piller inte mot."}, {"s": "GYN", "t": "Graviditet", "q": "En kvinna i graviditetsvecka 24 blir yr när hon gör magövningar liggande på rygg. Vad är orsaken, och vad råder du henne?", "o": ["Livmodern trycker på vena cava — byt till sida, sittande eller stående", "Graviditetshormoner sänker blodsockret — ät något före träningen", "Diafragma trycks upp och ger syrebrist — andas djupare under passet", "Relaxin gör blodkärlen slappa — träna med stödstrumpor på benen"], "c": 0, "e": "<strong>Rätt:<\/strong> i ryggläge trycker den tunga livmodern på <strong>vena cava inferior<\/strong>. Det venösa återflödet till hjärtat minskar, blodtrycket sjunker och hon blir yr. Råd: undvik övningar i ryggläge, träna sidliggande, sittande eller stående, och vänd dig på vänster sida om symtom kommer.<br><strong>Varför inte de andra:<\/strong> blodsocker, andning och relaxin förklarar inte att yrseln kommer just i ryggläge."}, {"s": "GYN", "t": "Graviditet", "q": "Vilken rekommendation för fysisk aktivitet gäller vid komplikationsfri graviditet?", "o": ["Minst 150 min pulshöjande per vecka och muskelstärkande 2 dagar per vecka", "Högst 60 min lätt aktivitet per vecka och ingen styrketräning alls", "Minst 300 min hög intensitet per vecka och styrketräning varje dag", "Dagliga promenader, men uppehåll med styrketräning tills efter förlossningen"], "c": 0, "e": "<strong>Rätt:<\/strong> alla gravida utan medicinska komplikationer bör rekommenderas <strong>minst 150 minuter pulshöjande aktivitet på måttlig intensitet<\/strong> per vecka och <strong>muskelstärkande aktivitet minst två dagar<\/strong> i veckan, plus bäckenbottenträning.<br><strong>Varför inte de andra:<\/strong> måttlig aktivitet under graviditet innebär mycket låga risker, så det finns inget skäl att avstå från styrketräning eller begränsa aktiviteten. Mycket hög intensitet varje dag är inte rekommendationen."}, {"s": "GYN", "t": "Graviditet", "q": "Vilket av följande är en varningssignal för att genast avbryta träningen hos en gravid kvinna?", "o": ["Vattenavgång", "Kraftig svettning", "Ökad andningsfrekvens", "Träningsvärk dagen efter"], "c": 0, "e": "<strong>Rätt:<\/strong> <strong>vattenavgång<\/strong> är en varningssignal. Andra är vaginal blödning, förvärkar, minskade fosterrörelser, yrsel, huvudvärk, bröstsmärta, muskelsvaghet, andnöd redan innan uttröttning och svullnad eller smärta i vaderna.<br><strong>Varför inte de andra:<\/strong> svettning, snabbare andning och träningsvärk är normala reaktioner på träning."}, {"s": "GYN", "t": "Graviditet", "q": "Hur mycket ökar graviditet risken för venös tromboembolism?", "o": ["Ungefär tio gånger", "Ungefär dubbelt så mycket", "Ingen säker ökning", "Ungefär hundra gånger"], "c": 0, "e": "<strong>Rätt:<\/strong> risken ökar <strong>ungefär tio gånger<\/strong>. Livmodern trycker på bäckenets kärl och blodet koagulerar lättare. Hälften av tromboserna inträffar under graviditeten och hälften under de första tolv veckorna efter förlossningen.<br><strong>Varför inte de andra:<\/strong> ökningen är betydande men inte hundrafaldig. Symtom att reagera på: smärta och svullnad i vad eller lår, plötslig andnöd och hjärtklappning."}, {"s": "GYN", "t": "Graviditet", "q": "Hur påverkar fysisk aktivitet risken för graviditetsdiabetes?", "o": ["Minskar den, genom ökad insulinkänslighet", "Ökar den, genom ökad frisättning av stresshormoner", "Påverkar den inte, eftersom den styrs av moderkakan", "Minskar den, men bara hos normalviktiga kvinnor"], "c": 0, "e": "<strong>Rätt:<\/strong> fysisk aktivitet gör vävnaderna <strong>mer insulinkänsliga<\/strong> och ökar musklernas glukosupptag. Effekten sitter i 24–48 timmar. Aktivitet före och under graviditeten skyddar mot graviditetsdiabetes.<br><strong>Varför inte de andra:<\/strong> skyddet gäller även kvinnor med övervikt och fetma — det är just där aktivitet på mer än 120 minuter i veckan har visats skydda."}, {"s": "GYN", "t": "Förlossning och bäckenbotten", "q": "Bäckenbotten förändras genom livet. Vilken beskrivning passar bäckenbotten i klimakteriet?", "o": ["Nedsatt styrka och elasticitet, stelare vävnad", "Ökad laxitet i ligamenten och ökat buktryck", "Omogen neuromuskulär kontroll av bäckenbotten", "Uttänjd muskulatur, eventuellt med skador"], "c": 0, "e": "<strong>Rätt:<\/strong> i klimakteriet ger östrogenbristen <strong>nedsatt styrka och elasticitet<\/strong> och stelare strukturer, vilket ökar risken för inkontinens och framfall.<br><strong>Varför inte de andra:<\/strong> ökad laxitet och ökat buktryck beskriver bäckenbotten <em>under graviditet<\/em>. Omogen funktion beskriver <em>barnet<\/em>. Uttänjd och skadad beskriver tiden <em>efter förlossningen<\/em>. Hos den vuxna kvinnan är överaktivitet och trängningar vanligt."}, {"s": "GYN", "t": "Förlossning och bäckenbotten", "q": "Hur behandlas en spänd och smärtande bäckenbotten?", "o": ["Avslappning, andning, kroppskännedom och manuell behandling", "Intensiv knipträning med maximala kontraktioner varje dag", "Vila från all fysisk aktivitet tills smärtan är borta", "Lokal östrogenbehandling och smärtstillande läkemedel"], "c": 0, "e": "<strong>Rätt:<\/strong> musklerna är redan för spända, så behandlingen går ut på att lära dem <strong>släppa<\/strong>: information om hur smärta och spänning förstärker varandra, andning med fokus på utandning, kroppskännedom, träning i att känna och sedan släppa kontraktionen, och manuell behandling.<br><strong>Varför inte de andra:<\/strong> knipträning kan förvärra en spänd bäckenbotten. Det är lika viktigt att kunna slappna av som att kunna knipa. Vila och läkemedel angriper inte själva spänningen."}, {"s": "GYN", "t": "Förlossning och bäckenbotten", "q": "Vilka besvär kan uppstå efter en förlossningsbristning som inte upptäckts eller inte läkt väl?", "o": ["Analinkontinens, urininkontinens, samlagssmärta, framfall", "Endometrios, PCOS, PMDS och sekundär amenorré", "Karpaltunnelsyndrom, foglossning och kvarstående rektusdiastas", "Graviditetsdiabetes, preeklampsi och kvarstående högt blodtryck"], "c": 0, "e": "<strong>Rätt:<\/strong> de fyra huvudsakliga besvären är <strong>analinkontinens<\/strong> (gas, soiling, avföring), <strong>urininkontinens<\/strong>, <strong>sexuell dysfunktion<\/strong> med samlagssmärta och <strong>framfall<\/strong>. Kvarstående smärta i mellangården och tömningssvårigheter förekommer också.<br><strong>Varför inte de andra:<\/strong> de listade tillstånden i de andra alternativen har inget med förlossningsskador att göra — de är hormonella tillstånd eller hör till själva graviditeten."}, {"s": "GYN", "t": "Förlossning och bäckenbotten", "q": "Hur mycket töjs levatormuskulaturen vid en vaginal förlossning?", "o": ["Mer än 300 %", "Cirka 30 %", "Cirka 100 %", "Ungefär 50 %"], "c": 0, "e": "<strong>Rätt:<\/strong> levator ani töjs <strong>mer än 300 %<\/strong> (uppmätt ca 340 %) när barnets huvud passerar. Därför kan muskler, bindväv och nerver skadas även när ingen bristning syns.<br><strong>Varför inte de andra:<\/strong> töjningen är långt större än vad en skelettmuskel normalt utsätts för."}, {"s": "GYN", "t": "Förlossning och bäckenbotten", "q": "Vad innebär en grad 3-bristning vid förlossning?", "o": ["Skada även på analsfinktern", "Skada på hud och slemhinna", "Skada på perinealmusklerna men inte sfinktern", "Skada även på rektalslemhinnan"], "c": 0, "e": "<strong>Rätt:<\/strong> grad 3 innebär att <strong>analsfinktern<\/strong> är helt eller delvis skadad. Grad 3 och 4 ökar risken för analinkontinens.<br><strong>Varför inte de andra:<\/strong> hud och slemhinna är grad 1. Perinealmusklerna utan sfinkterskada är grad 2. Skada även på rektalslemhinnan är grad 4."}, {"s": "GYN", "t": "Förlossning och bäckenbotten", "q": "Vad innebär ”the knack”?", "o": ["Att knipa innan en aktivitet som ökar buktrycket", "Att slappna av i bäckenbotten vid varje toalettbesök", "Att knipa maximalt tio gånger varje vaken timme", "Att andas ut långsamt och kontrollerat vid tunga lyft"], "c": 0, "e": "<strong>Rätt:<\/strong> att <strong>aktivt knipa innan<\/strong> man hostar, nyser eller lyfter. Det stabiliserar urinröret och minskar läckage just vid den belastningen.<br><strong>Varför inte de andra:<\/strong> avslappning vid toalettbesök är viktigt men är inte ”the knack”. Maxknip varje timme är inte en funktionell strategi."}, {"s": "GYN", "t": "Förlossning och bäckenbotten", "q": "Vad räknas som normala miktionsvanor?", "o": ["5–7 gånger per dygn, ingen gång nattetid", "10–12 gånger per dygn, 1–2 gånger nattetid", "2–3 gånger per dygn, ingen gång nattetid", "8–10 gånger per dygn, 2 gånger nattetid"], "c": 0, "e": "<strong>Rätt:<\/strong> normalt är <strong>5–7 miktioner per dygn<\/strong> och <strong>ingen nattetid<\/strong>, med 2–4 dl per tillfälle och ett vätskeintag på 1–2 liter.<br><strong>Varför inte de andra:<\/strong> 8 eller fler miktioner per dygn och 2 eller fler nattetid räknas som trängningssymtom (överaktiv blåsa)."}, {"s": "GYN", "t": "Förlossning och bäckenbotten", "q": "Vilket av följande är en röd flagga relaterad till blåsa och tarm?", "o": ["Blod i urinen", "Gasavgång flera gånger om dagen", "Tarmtömning varannan dag", "Trängning efter stort vätskeintag"], "c": 0, "e": "<strong>Rätt:<\/strong> <strong>blod i urinen<\/strong> ska alltid leda till läkarbedömning. Andra röda flaggor är blod i avföringen, nattligt läckage i sömnen, plötsligt nytt läckage utan skada, och att hela blåsan töms utan förvarning.<br><strong>Varför inte de andra:<\/strong> gasavgång är normalt, tarmtömning varannan dag ligger inom normalvariationen, och trängning efter mycket vätska är en normal reaktion."}, {"s": "GYN", "t": "Amenorré och RED-S", "q": "Vilka konsekvenser kan hypotalamisk amenorré leda till?", "o": ["Infertilitet, låg bentäthet, stressfrakturer", "Förtjockad hjärtmuskel, osteoporos, akne", "Nedsatt fertilitet, ökad muskelmassa, akne", "Förlängda tillväxtzoner, låg puls, akne"], "c": 0, "e": "<strong>Rätt:<\/strong> när ägglossningen uteblir sjunker östrogenet. Det ger <strong>infertilitet<\/strong>, <strong>minskad bentäthet<\/strong>, ökad risk för <strong>stressfrakturer<\/strong> och hos unga <strong>hämmad skelettutveckling<\/strong>.<br><strong>Varför inte de andra:<\/strong> akne, ökad muskelmassa och förtjockad hjärtmuskel hör inte till östrogenbrist. Östrogenbrist ger inte förlängda tillväxtzoner."}, {"s": "GYN", "t": "Amenorré och RED-S", "q": "Vilken kedja förklarar hypotalamisk amenorré vid energibrist?", "o": ["Energibrist → GnRH ↓ → FSH/LH ↓ → östrogen ↓", "Energibrist → östrogen ↑ → LH ↓ → GnRH ↓", "Energibrist → testosteron ↑ → FSH ↑ → östrogen ↓", "Energibrist → FSH/LH ↑ → GnRH ↓ → östrogen ↓"], "c": 0, "e": "<strong>Rätt:<\/strong> hypothalamus nedprioriterar reproduktionen och minskar <strong>GnRH<\/strong> → hypofysen frisätter mindre <strong>FSH och LH<\/strong> → äggstockarna stimuleras inte → <strong>östrogenet sjunker<\/strong> → mensen uteblir.<br><strong>Varför inte de andra:<\/strong> kedjan börjar högst upp, i hypothalamus, och går nedåt. Östrogen stiger inte, och FSH och LH sjunker i stället för att stiga."}, {"s": "GYN", "t": "Amenorré och RED-S", "q": "En 17-årig löpare har haft upprepade stressfrakturer och oregelbunden mens. Vilket råd är rätt?", "o": ["Mer energi, anpassad belastning, remiss till läkare och dietist", "Fortsätt som vanligt — mensrubbning är normalt vid hård träning", "Helt träningsuppehåll i sex månader och kalciumtillskott", "P-piller för regelbunden mens, sedan full träning igen"], "c": 0, "e": "<strong>Rätt:<\/strong> förklara sambandet energibrist → låg östrogen → svagt skelett, <strong>öka energiintaget<\/strong> i förhållande till träningen, <strong>anpassa belastningen<\/strong> tillfälligt och <strong>remittera<\/strong> till läkare och dietist.<br><strong>Varför inte de andra:<\/strong> utebliven mens hos en idrottande ung kvinna är aldrig ”normalt vid träning”. Totalt träningsstopp är inte nödvändigt. P-piller ger en blödning men åtgärdar inte energibristen."}, {"s": "GYN", "t": "Endometrios", "q": "Vad är endometrios?", "o": ["Livmoderslemhinneliknande vävnad utanför livmodern", "Infertilitet på grund av utebliven ägglossning", "Inflammation i äggledarna efter en klamydiainfektion", "Förtjockad slemhinna inne i livmodern", "Oregelbunden mens på grund av hormonrubbning"], "c": 0, "e": "<strong>Rätt:<\/strong> vävnad som liknar livmoderslemhinnan växer <strong>utanför livmodern<\/strong> — på äggstockar, bukhinna, tarm och blåsa. Den följer menscykeln och ger cyklisk inflammation och smärta.<br><strong>Varför inte de andra:<\/strong> infertilitet kan vara en <em>följd<\/em> av endometrios men är inte vad det är. Äggledarinflammation och mensrubbning är andra tillstånd."}, {"s": "GYN", "t": "Endometrios", "q": "Vilket hormon driver endometrios?", "o": ["Östrogen", "Progesteron", "Testosteron", "Prolaktin"], "c": 0, "e": "<strong>Rätt:<\/strong> endometrios är <strong>östrogenberoende<\/strong> — härdarna växer under östrogenpåverkan. Därför syftar behandlingen till att dämpa den cykliska hormonstimuleringen.<br><strong>Varför inte de andra:<\/strong> progesteron (gestagen) används tvärtom i behandlingen, t.ex. som minipiller eller hormonspiral."}, {"s": "GYN", "t": "Endometrios", "q": "Vad är förstahandsbehandling vid endometrios?", "o": ["Hormonell behandling", "Laparoskopisk operation", "Antibiotika under en månad", "Enbart smärtstillande"], "c": 0, "e": "<strong>Rätt:<\/strong> <strong>hormonell behandling<\/strong> — p-piller, minipiller, hormonspiral eller GnRH-analog. Utan hormonsvängningar blöder och inflammeras härdarna mindre, och smärtan minskar. Smärtlindring, träning och TENS kompletterar.<br><strong>Varför inte de andra:<\/strong> operation övervägs först vid otillräcklig effekt av hormoner. Endometrios är ingen infektion. Smärtstillande ensamt angriper inte orsaken."}];
const SUBJ = [["ORT","Ortopedi"],["KIR","Kirurgi"],["MED","Allmän medicin"],["REU","Reumatologi"],["GYN","Gynekologi"]];
const SN = Object.fromEntries(SUBJ);
const ORDER = SUBJ.map(s => s[0]);
const KEY = 'med1-quiz-v1';
const LETTERS = 'ABCDEF';

// stable numbering: subject code + topic number + question number within topic
const TOPICS = {};
Q.forEach((q, i) => {
  q.i = i;
  if (!TOPICS[q.s]) TOPICS[q.s] = [];
  if (!TOPICS[q.s].includes(q.t)) TOPICS[q.s].push(q.t);
});
const tcount = {};
Q.forEach(q => {
  const ti = TOPICS[q.s].indexOf(q.t) + 1;
  const k = q.s + ti; tcount[k] = (tcount[k] || 0) + 1;
  q.num = q.s + ' ' + ti + '.' + tcount[k];
  q.id = q.num;
});
const SEQ = [...Q].sort((a, b) => ORDER.indexOf(a.s) - ORDER.indexOf(b.s) || TOPICS[a.s].indexOf(a.t) - TOPICS[b.s].indexOf(b.t) || a.i - b.i).map(q => q.i);

let ans = load(), sub = null, topic = null, mode = 'shuffle', queue = [], cur = 0, perm = {};

function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
function persist() { try { localStorage.setItem(KEY, JSON.stringify(ans)); } catch (e) {} }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function plain(s) { return s.replace(/<[^>]*>/g, ''); }

function pool() { return SEQ.filter(i => (!sub || Q[i].s === sub) && (!topic || Q[i].t === topic)); }

function buildPills() {
  let h = '<button class="pill' + (!sub ? ' active' : '') + '" onclick="setSub(null)">Alla (' + Q.length + ')</button>';
  SUBJ.forEach(([c, n]) => {
    const k = Q.filter(q => q.s === c).length;
    h += '<button class="pill' + (sub === c ? ' active' : '') + '" onclick="setSub(\'' + c + '\')">' + n + ' (' + k + ')</button>';
  });
  document.getElementById('pills').innerHTML = h;
  const tp = document.getElementById('topics');
  if (!sub) { tp.hidden = true; return; }
  let t = '<button class="pill' + (!topic ? ' active' : '') + '" onclick="setTopic(null)">Alla områden</button>';
  TOPICS[sub].forEach((name, k) => {
    const n = Q.filter(q => q.s === sub && q.t === name).length;
    t += '<button class="pill' + (topic === name ? ' active' : '') + '" onclick="setTopic(' + k + ')">' + (k + 1) + '. ' + name + ' (' + n + ')</button>';
  });
  tp.innerHTML = t; tp.hidden = false;
}
function setSub(s) { sub = s; topic = null; buildPills(); start(); }
function setTopic(k) { topic = k === null ? null : TOPICS[sub][k]; buildPills(); start(); }
function setMode(m) {
  mode = m;
  document.getElementById('m-shuffle').classList.toggle('active', m === 'shuffle');
  document.getElementById('m-seq').classList.toggle('active', m === 'seq');
  start();
}

function start(ids) {
  const base = ids || pool();
  queue = mode === 'shuffle' ? shuffle([...base]) : [...base];
  perm = {};
  const firstOpen = queue.findIndex(i => !ans[Q[i].id]);
  cur = firstOpen === -1 ? 0 : firstOpen;
  document.getElementById('finish').hidden = true;
  document.getElementById('q-area').hidden = false;
  render();
}

function order(i) {
  if (!perm[i]) perm[i] = shuffle(Q[i].o.map((_, k) => k));
  return perm[i];
}

function render() {
  if (cur >= queue.length) { finish(); return; }
  const i = queue[cur], q = Q[i], a = ans[q.id], ord = order(i);
  document.getElementById('q-sec').textContent = SN[q.s] + ' · ' + q.t;
  document.getElementById('q-num').textContent = q.num;
  document.getElementById('q-text').innerHTML = q.q;
  let h = '';
  ord.forEach((k, pos) => {
    let cls = 'opt';
    if (a) {
      if (k === q.c) cls += ' correct';
      else if (k === a.sel) cls += ' wrong';
      else cls += ' dim';
    }
    h += '<button class="' + cls + '"' + (a ? ' disabled' : '') + ' onclick="answer(' + k + ')"><span class="key">' + LETTERS[pos] + '</span><span>' + q.o[k] + '</span></button>';
  });
  document.getElementById('opts').innerHTML = h;
  const ex = document.getElementById('expl');
  if (a) {
    const right = LETTERS[ord.indexOf(q.c)];
    ex.innerHTML = (a.sel === q.c ? '<div class="verdict ok">Rätt!</div>' : '<div class="verdict bad">Fel — rätt svar är ' + right + '</div>') + q.e;
    ex.hidden = false;
  } else ex.hidden = true;
  document.getElementById('prev').hidden = cur === 0;
  const nx = document.getElementById('next');
  nx.textContent = cur === queue.length - 1 ? 'Visa resultat →' : (a ? 'Nästa →' : 'Hoppa över →');
  nx.classList.toggle('primary', !!a);
  stats();
}

function answer(k) {
  const q = Q[queue[cur]];
  if (ans[q.id]) return;
  ans[q.id] = { sel: k, ok: k === q.c };
  persist(); render();
}
function go(d) { cur += d; if (cur < 0) cur = 0; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

function stats() {
  let ok = 0, bad = 0, done = 0;
  queue.forEach(i => { const a = ans[Q[i].id]; if (a) { done++; a.ok ? ok++ : bad++; } });
  document.getElementById('st-num').textContent = Math.min(cur + 1, queue.length);
  document.getElementById('st-tot').textContent = queue.length;
  document.getElementById('st-ok').textContent = ok;
  document.getElementById('st-bad').textContent = bad;
  document.getElementById('p-label').textContent = done + ' / ' + queue.length + ' besvarade';
  document.getElementById('p-fill').style.width = (queue.length ? done / queue.length * 100 : 0) + '%';
}

function pctClass(p) { return p >= 66 ? 'pct-ok' : p >= 33 ? 'pct-warn' : 'pct-bad'; }
function finish() {
  document.getElementById('q-area').hidden = true;
  document.getElementById('finish').hidden = false;
  let ok = 0, done = 0; const per = {};
  queue.forEach(i => {
    const q = Q[i], a = ans[q.id];
    per[q.s] = per[q.s] || { ok: 0, n: 0, t: {} };
    per[q.s].t[q.t] = per[q.s].t[q.t] || { ok: 0, n: 0 };
    if (a) { done++; per[q.s].n++; per[q.s].t[q.t].n++; if (a.ok) { ok++; per[q.s].ok++; per[q.s].t[q.t].ok++; } }
  });
  const pct = done ? Math.round(ok / done * 100) : 0;
  document.getElementById('f-pct').textContent = pct + ' %';
  document.getElementById('f-sub').textContent = ok + ' rätt av ' + done + ' besvarade' + (done < queue.length ? ' (' + (queue.length - done) + ' obesvarade)' : '');
  let b = '<h3>Per ämne och område</h3>';
  ORDER.forEach(s => {
    const p = per[s]; if (!p || !p.n) return;
    const sp = Math.round(p.ok / p.n * 100);
    b += '<div class="b-row"><span class="b-name"><strong>' + SN[s] + '</strong></span><span class="b-num">' + p.ok + ' / ' + p.n + '</span><span class="b-pct ' + pctClass(sp) + '">' + sp + ' %</span></div>';
    TOPICS[s].forEach(t => {
      const x = p.t[t]; if (!x || !x.n) return;
      const tp = Math.round(x.ok / x.n * 100);
      b += '<div class="b-row"><span class="b-name b-sub">' + t + '</span><span class="b-num">' + x.ok + ' / ' + x.n + '</span><span class="b-pct ' + pctClass(tp) + '">' + tp + ' %</span></div>';
    });
  });
  b += '<div class="note">Godkänt på tentan kräver 66 % totalt och minst 33 % i varje ämne.</div>';
  document.getElementById('f-break').innerHTML = b;
  document.getElementById('r-wrong').disabled = !queue.some(i => ans[Q[i].id] && !ans[Q[i].id].ok);
  document.getElementById('r-skip').disabled = !queue.some(i => !ans[Q[i].id]);
  stats();
}

function restart(kind) {
  let ids = queue.slice();
  if (kind === 'wrong') ids = queue.filter(i => ans[Q[i].id] && !ans[Q[i].id].ok);
  if (kind === 'skipped') ids = queue.filter(i => !ans[Q[i].id]);
  if (kind !== 'skipped') ids.forEach(i => delete ans[Q[i].id]);
  persist();
  if (mode === 'seq') ids.sort((a, b) => SEQ.indexOf(a) - SEQ.indexOf(b));
  start(ids);
}
function resetAll() {
  if (!confirm('Nollställa alla sparade svar?')) return;
  ans = {}; persist(); start();
}

function openIndex() { document.getElementById('idx-search').value = ''; renderIndex(); document.getElementById('idx').hidden = false; }
function closeIndex(e) { if (e && e.target !== document.getElementById('idx')) return; document.getElementById('idx').hidden = true; }
function renderIndex() {
  const s = document.getElementById('idx-search').value.toLowerCase();
  let h = '', lastS = null, lastT = null;
  pool().forEach(i => {
    const q = Q[i];
    const txt = plain(q.q);
    if (s && !(q.num + ' ' + SN[q.s] + ' ' + q.t + ' ' + txt).toLowerCase().includes(s)) return;
    if (q.s !== lastS) { h += '<div class="idx-group">' + SN[q.s] + '</div>'; lastS = q.s; lastT = null; }
    if (q.t !== lastT) { h += '<div class="idx-topic">' + (TOPICS[q.s].indexOf(q.t) + 1) + '. ' + q.t + '</div>'; lastT = q.t; }
    const a = ans[q.id];
    const badge = a ? '<span class="badge ' + (a.ok ? 'ok">Rätt' : 'bad">Fel') + '</span>' : '';
    h += '<div class="idx-item" onclick="jump(' + i + ')"><span class="idx-num">' + q.num + '</span><span class="idx-q">' + (txt.length > 90 ? txt.slice(0, 90) + '…' : txt) + '</span>' + badge + '</div>';
  });
  document.getElementById('idx-body').innerHTML = h || '<p style="padding:14px 0;font-size:13px;color:var(--text-secondary)">Inga frågor matchar.</p>';
}
function jump(i) {
  let k = queue.indexOf(i);
  if (k === -1) { queue.push(i); k = queue.length - 1; }
  cur = k;
  document.getElementById('idx').hidden = true;
  document.getElementById('finish').hidden = true;
  document.getElementById('q-area').hidden = false;
  render(); window.scrollTo({ top: 0 });
}

document.addEventListener('keydown', e => {
  if (!document.getElementById('idx').hidden || e.target.tagName === 'INPUT') return;
  if (document.getElementById('q-area').hidden) return;
  const q = Q[queue[cur]]; if (!q) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= q.o.length && !ans[q.id]) { answer(order(queue[cur])[n - 1]); return; }
  const L = LETTERS.toLowerCase().indexOf(e.key.toLowerCase());
  if (e.key.length === 1 && L >= 0 && L < q.o.length && !ans[q.id]) { answer(order(queue[cur])[L]); return; }
  if (e.key === 'ArrowRight' || (e.key === 'Enter' && ans[q.id])) go(1);
  if (e.key === 'ArrowLeft') go(-1);
});

const THEMES = ['system', 'light', 'dark'], TLABEL = { system: 'Tema: auto', light: 'Tema: ljust', dark: 'Tema: mörkt' };
function curTheme() { try { return localStorage.getItem('fysio-theme') || 'system'; } catch (e) { return 'system'; } }
function applyTheme(t) {
  if (t === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
  document.getElementById('theme-btn').textContent = TLABEL[t];
}
function cycleTheme() {
  const t = THEMES[(THEMES.indexOf(curTheme()) + 1) % 3];
  try { localStorage.setItem('fysio-theme', t); } catch (e) {}
  applyTheme(t);
}
applyTheme(curTheme());
buildPills(); start();
</script>
